name: Azure Static Web Apps CI/CD

# Main only, on purpose.
#
# The scaffolded workflow also ran on every pull request, and each run asked
# Azure for a preview environment of its own. A Free-tier Static Web App allows
# three of those, and the previews from earlier pull requests are still holding
# them, so every run since has been rejected with "This Static Web App already
# has the maximum number of staging environments". The tear-down job then
# failed too -- there was no preview to close, so it reported "No matching
# static site found" -- which is why one pull request produced two red checks
# and neither had anything to do with the code in it.
#
# There is nothing in a preview that main does not show a minute later, so the
# pull_request trigger and the job that tore those previews down are both gone.
# To bring previews back, delete the stale environments in the Azure portal
# (Static Web App -> Environments) and restore the trigger and the close job.
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Remove npm artifacts left by the OIDC step
        # `npm install` above runs in the repo root and creates a package.json
        # with no "scripts" section. Oryx then treats this static site as a Node
        # app, looks for a build script and fails. This site has no build step,
        # so drop those files (and keep node_modules out of the upload).
        run: rm -rf node_modules package.json package-lock.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_TREE_0F0B12403 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # No build step: serve app_location as-is
          skip_app_build: true
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
