<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Harvest Hero</title>
<meta name="description" content="A cosy isometric farm tycoon: sweep the wheat, haul the harvest, build up the farm.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#1b2a14;
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:800;color:#fff;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .pop{text-shadow:0 2px 0 rgba(0,0,0,.45)}

  /* ---------- resource pills ---------- */
  #res{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;z-index:5;
    display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .pill{position:relative;height:36px;min-width:126px;border-radius:18px;
    background:linear-gradient(#3a2e20,#241a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 6px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:flex-end;padding:0 14px 0 40px;
    font-size:20px;transition:transform .12s}
  .pill.bump{transform:scale(1.12)}
  .pill.hide{display:none}
  .pill i{position:absolute;left:-5px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-style:normal;
    background:linear-gradient(#f4f0e4,#cfc7b2);box-shadow:0 3px 5px rgba(0,0,0,.4),inset 0 2px 0 #fff}
  /* a drop shadow instead of an outline: the pale goods (flour, milk, egg)
     are nearly the colour of the disc they sit on */
  .pill i img{width:31px;height:31px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}

  /* ---------- bottom bar ---------- */
  #bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
  #levelbar{height:12px;margin:0 0 0;background:rgba(0,0,0,.45)}
  #levelfill{height:100%;width:0%;background:linear-gradient(90deg,#49b6ff,#8ee4ff);transition:width .3s}
  #btmrow{display:flex;align-items:center;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
  .round{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(20,14,6,.6);color:#fff;font-size:19px;display:grid;place-items:center}
  /* The rank sits on its own line: on a phone it shared the row with five
     buttons and every long title was cut off by the ellipsis. */
  #lvlrow{display:flex;justify-content:center;padding:8px 12px 0}
  #lvltxt{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:9px;
    max-width:min(560px,94vw);padding:6px 14px 8px;border-radius:15px;
    background:linear-gradient(rgba(44,32,16,.82),rgba(20,14,6,.88));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 7px rgba(0,0,0,.42)}
  #lvltxt:active{transform:translateY(2px)}
  #lvlnum{flex:none;font-size:14px;font-weight:900;letter-spacing:.05em;color:#40300f;
    background:linear-gradient(#ffd868,#efa72a);border-radius:9px;padding:3px 9px 4px}
  #lvlname{font-size:16.5px;font-weight:900;letter-spacing:.01em;color:#ffe9b8;line-height:1.2;
    text-shadow:0 2px 3px rgba(0,0,0,.6);overflow-wrap:anywhere}

  /* ---------- bag panel ---------- */
  #b-bag{position:absolute;left:50%;transform:translateX(-50%);z-index:6;
    bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:none;
    border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:16px;color:#4a3418;
    padding:11px 20px 13px;border-radius:16px;letter-spacing:.02em;
    background:linear-gradient(#ffe8a8,#f3c95f);box-shadow:0 5px 0 #c9942a,0 9px 16px rgba(0,0,0,.42)}
  #b-bag.on{display:block}
  #b-bag:active{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 #c9942a}
  #bag{text-align:left;max-height:56vh;overflow-y:auto}
  #bag .cq{font-size:12.5px;font-weight:800;color:#8a7b63}
  .crow.till{border-bottom:none;margin-top:4px;padding-top:11px;border-top:2px solid rgba(122,79,29,.25)}
  #bagmsg{margin-top:8px;font-size:13px;font-weight:800;color:#b23b3b;min-height:16px}

  /* ---------- tutorial / toast ---------- */
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:78px;z-index:6;
    padding:9px 18px 11px;border-radius:15px;background:rgba(20,14,6,.8);font-size:15px;
    text-align:center;max-width:78vw;opacity:0;transition:opacity .35s;pointer-events:none;line-height:1.35}
  #hint.on{opacity:1}

  /* ---------- story chapter ---------- */
  #chapter{position:absolute;left:50%;transform:translate(-50%,16px);z-index:7;
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    width:min(370px,88vw);padding:12px 15px 14px;border-radius:18px;
    background:linear-gradient(#fffaf0,#f0e2c2);color:#4a3418;
    box-shadow:0 8px 0 #c9a96a,0 14px 24px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
  #chapter.on{opacity:1;transform:translate(-50%,0)}
  #chapter .ch-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  #chapter .ch-i{font-size:24px}
  #chapter .ch-t{font-size:17px;font-weight:900;color:#a8560f;letter-spacing:.01em}
  #chapter .ch-b{font-size:13.5px;font-weight:700;line-height:1.42}

  /* ---------- milestone banner ---------- */
  #banner{position:absolute;left:50%;transform:translate(-50%,-26px);z-index:8;
    top:calc(env(safe-area-inset-top,0px) + 92px);width:min(360px,86vw);
    padding:12px 18px 14px;border-radius:18px;text-align:center;
    background:linear-gradient(#fff3c4,#f3d169);color:#6b4410;
    box-shadow:0 7px 0 #c08f2a,0 14px 26px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
  #banner.on{opacity:1;transform:translate(-50%,0)}
  #bn-k{font-size:11.5px;font-weight:900;letter-spacing:.16em;color:#b07a25;margin-bottom:2px}
  #bn-t{font-size:19px;font-weight:900;letter-spacing:.02em;color:#a8560f;line-height:1.15}
  #bn-l{font-size:13.5px;font-weight:700;margin-top:3px;line-height:1.35}

  /* ---------- party ---------- */
  #party{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);
    z-index:7;display:none;flex-direction:column;align-items:center;gap:8px}
  #party.on{display:flex}
  #p-tip{font-size:13px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);letter-spacing:.03em}
  #p-dance{border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:25px;letter-spacing:.06em;
    color:#fff;padding:15px 52px 19px;border-radius:20px;
    background:linear-gradient(#ff7bc8,#d8329a);box-shadow:0 6px 0 #9c1f70,0 10px 18px rgba(0,0,0,.4);
    text-shadow:0 2px 0 rgba(0,0,0,.25);animation:bounce 1.07s ease-in-out infinite}
  #p-dance:active{transform:translateY(5px);box-shadow:0 1px 0 #9c1f70}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #p-end{border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:13px;color:#4a3418;
    padding:7px 16px 9px;border-radius:12px;background:rgba(255,248,230,.9);box-shadow:0 3px 0 #c9a96a}

  /* ---------- shop ---------- */
  #shop{text-align:left;max-height:56vh;overflow-y:auto}
  .crow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(122,79,29,.16)}
  .crow.party{border-bottom:none;margin-top:4px;padding-top:11px;border-top:2px solid rgba(122,79,29,.25)}
  .crow .ci{font-size:22px;width:26px;text-align:center}
  .crow .ci img{width:26px;height:26px;display:block;margin:0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .crow .cn{flex:1;font-size:14.5px;font-weight:800}
  .cb{border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:12.5px;color:#5c4526;
    padding:7px 11px 9px;border-radius:10px;min-width:82px;
    background:linear-gradient(#efe6d0,#d7c9a8);box-shadow:0 3px 0 #b0a084}
  .cb.buy{background:linear-gradient(#7ed34f,#4da32c);color:#fff;box-shadow:0 3px 0 #34781d}
  .cb.buy.poor{background:linear-gradient(#ded4bd,#c2b69c);color:#8a7b63;box-shadow:0 3px 0 #a3957c}
  .cb.on{background:linear-gradient(#63c1ff,#2f8fe0);color:#fff;box-shadow:0 3px 0 #1d6bb0}
  .cb:active{transform:translateY(2px);box-shadow:none}
  #shopmsg{margin-top:8px;font-size:13px;font-weight:800;color:#b23b3b;min-height:16px}

  /* ---------- journal ---------- */
  #ranks{text-align:left;max-height:50vh;overflow-y:auto;margin:-2px 0 4px}
  .rr{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid rgba(122,79,29,.16)}
  .rr:last-child{border-bottom:none}
  .rr .rl{width:30px;flex:none;text-align:center;font-weight:900;font-size:13px;color:#a8560f}
  .rr .rn{flex:1;font-size:14px;font-weight:800;min-width:0}
  .rr .rq{font-size:11.5px;font-weight:800;color:#8a7b63;white-space:nowrap}
  .rr.lock{opacity:.5}
  .rr.cur{background:rgba(255,196,84,.28);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(200,135,30,.5)}
  .rr.cur .rn{color:#8a4708}
  #rnext{margin-top:2px}
  #jrn{text-align:left;max-height:54vh;overflow-y:auto}
  #jrn .e{padding:10px 0;border-bottom:1px solid rgba(122,79,29,.18)}
  #jrn .e:last-child{border-bottom:none}
  #jrn .e b{display:block;font-size:15px;color:#a8560f;margin-bottom:3px}
  #jrn .e span{font-size:13.5px;font-weight:700;line-height:1.45;display:block}
  #jrn .lock{opacity:.45;font-style:italic}

  /* ---------- save panel ---------- */
  #savebox{text-align:left}
  #savebox p{font-size:13.5px;margin-bottom:9px}
  #savetxt{width:100%;height:92px;resize:vertical;border-radius:10px;padding:8px 10px;
    border:2px solid #c9a96a;background:#fffdf5;color:#5c4526;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.4}
  .sbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .sbtn{flex:1 1 calc(50% - 8px);border:none;cursor:pointer;font-family:inherit;font-weight:900;
    font-size:14px;color:#fff;padding:9px 10px 11px;border-radius:11px;
    background:linear-gradient(#7aa7d8,#4a7cb5);box-shadow:0 4px 0 #35608f;text-shadow:0 1px 0 rgba(0,0,0,.25)}
  .sbtn.go{background:linear-gradient(#7ed34f,#4da32c);box-shadow:0 4px 0 #34781d}
  .sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #35608f}
  #savemsg{margin-top:9px;font-size:13px;font-weight:800;min-height:17px}
  #savemsg.s-ok{color:#2e8b3f} #savemsg.s-bad{color:#b23b3b}

  /* ---------- modal ---------- */
  #modal{position:absolute;inset:0;z-index:9;display:none;place-items:center;background:rgba(8,14,6,.72);padding:24px}
  #modal.on{display:grid}
  #card{width:min(420px,90vw);border-radius:24px;padding:26px 24px 22px;text-align:center;
    background:linear-gradient(#fff8e6,#f2e3bf);color:#4a3418;box-shadow:0 14px 0 #c9a96a,0 22px 40px rgba(0,0,0,.5)}
  #card h2{font-size:27px;margin-bottom:10px;color:#a8560f}
  #card p{font-size:17px;line-height:1.5;font-weight:700;margin-bottom:8px}
  #card [hidden]{display:none!important}
  .mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  #card .ok{border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:17px;color:#fff;
    padding:11px 17px 14px;border-radius:14px;background:linear-gradient(#7ed34f,#4da32c);
    box-shadow:0 5px 0 #34781d;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #card .ok.cancel{background:linear-gradient(#efe6d0,#d7c9a8);color:#5c4526;
    box-shadow:0 5px 0 #b0a084;text-shadow:none}
  #card .ok.danger{background:linear-gradient(#f2806d,#d24430);box-shadow:0 5px 0 #9b2f1f}
  #card .ok:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  #card .sub{font-size:14px;opacity:.75;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="res">
    <div class="pill pop" id="p-coin"><i>&#128181;</i><span>0</span></div>
  </div>

  <div id="chapter"><div class="ch-h"><div class="ch-i"></div><div class="ch-t"></div></div><div class="ch-b"></div></div>

  <div id="banner"><div id="bn-k"></div><div id="bn-t"></div><div id="bn-l"></div></div>

  <div id="party">
    <div id="p-tip">Tap in time &mdash; two moves</div>
    <button id="p-dance">DANCE</button>
    <button id="p-end">BACK TO WORK</button>
  </div>

  <div id="hint" class="pop"></div>

  <button id="b-bag">&#127890; INVENTORY</button>

  <div id="bottom">
    <div id="levelbar"><div id="levelfill"></div></div>
    <div id="lvlrow">
      <div id="lvltxt" class="pop"><b id="lvlnum">LVL 1</b><span id="lvlname">Field Hand</span></div>
    </div>
    <div id="btmrow">
      <button class="round" id="b-sound">&#128266;</button>
      <button class="round" id="b-journal" title="Journal">&#128214;</button>
      <button class="round" id="b-shop" title="Shop">&#128717;</button>
      <button class="round" id="b-save" title="Save file">&#128190;</button>
      <button class="round" id="b-reset" title="Restart farm">&#8635;</button>
    </div>
  </div>

  <div id="modal"><div id="card">
    <h2 id="m-title"></h2>
    <div id="m-body"></div>
    <div class="mbtns">
      <button class="ok cancel" id="m-cancel" hidden>CANCEL</button>
      <button class="ok" id="m-ok">OK</button>
    </div>
  </div></div>
</div>
<script>
'use strict';
/* =========================================================================
   HARVEST HERO — an idle isometric farm tycoon.
   Single file, no dependencies, no build step. Canvas 2D isometric.
   ========================================================================= */

const cvs = document.getElementById('game');
/* Not const: itemIcon() borrows the drawing code for a moment to paint the
   HUD icons into a canvas of their own. */
let ctx = cvs.getContext('2d');
const TW = 74, TH = 37;                 // iso tile width / height in px
let CW = 0, CH = 0, ZOOM = 1;

const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const iso   = (x,y)=>({ sx:(x-y)*(TW/2), sy:(x+y)*(TH/2) });
function fmt(n){
  n = Math.floor(n);
  if(n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M';
  if(n >= 1e4) return (n/1e3).toFixed(n>=1e5?0:1)+'k';
  return String(n);
}

/* ---------------------------------------------------------------- world */
const MAP = { w:40, h:56 };

/* Eight goods, three production chains:
     wheat -> flour -> (with egg) pie
     wheat -> egg / milk -> cheese
     apple -> jam                                                          */
const ITEM_ORDER = ['wheat','apple','cherry','flour','egg','milk','jam','cherryjam','cheese','pie','cherrypie'];
/* A good is its `label` and its case in drawItem(), and that drawing is what
   the HUD and the bag panel show as well. There was an emoji column here too
   and it drifted: a honey pot stood in for cherry jam and a tub of ice cream
   for cherry pie, so the pills said one thing and the trays another. */
const ITEMS = {
  wheat: { label:'WHEAT',  price:3  },
  apple: { label:'APPLES', price:7  },
  flour: { label:'FLOUR',  price:9  },
  egg:   { label:'EGGS',   price:11 },
  milk:  { label:'MILK',   price:16 },
  jam:   { label:'APPLE JAM', price:34 },
  cherry:    { label:'CHERRIES',    price:14  },
  cherryjam: { label:'CHERRY JAM',  price:95  },
  cherrypie: { label:'CHERRY PIE',  price:130 },
  cheese:{ label:'CHEESE', price:52 },
  pie:   { label:'PIES',   price:46 },
};
const emptyBag = ()=>{ const o={}; for(const k of ITEM_ORDER) o[k]=0; return o; };

/* Things you harvest by walking through them. */
const PATCHES = [
  { id:'field',   item:'wheat', kind:'crop', cell:1.0, regrow:7,  yieldMul:1, gate:null,
    rect:{ x:19, y:4,  w:13, h:24 } },
  /* The groves run the length of the valley: twenty trees apiece, twice what
     they held. `pickMul` is what the player's own hands manage in them --
     fruit comes off a branch at half the speed the scythe takes wheat, and
     it stays half however sharp the scythe gets. */
  { id:'orchard', item:'apple',  kind:'tree', cell:2.4, regrow:14, yieldMul:3, gate:'orchard',
    pickMul:0.5, fruit:'#d8402f', leaf:'#2f7a34', rect:{ x:19.6, y:30, w:4.9, h:24 } },
  { id:'cherry',  item:'cherry', kind:'tree', cell:2.4, regrow:17, yieldMul:3, gate:'cherry',
    pickMul:0.5, fruit:'#8e1533', leaf:'#276b2c', rect:{ x:25.2, y:30, w:4.9, h:24 } },
];

/* Stations sit on the far (west) side so nothing ever hides the player.
   Their trays are on the near (east) face, in front of the walls.
   A batch takes twice as long as it once did: with artisans hired a workshop
   turns out `1 + crew` of a thing at a time, and at the old times the trays
   filled faster than anyone could carry them away.                       */
const STATIONS = [
  { id:'market', name:'MARKET', kind:'sell', unlocked:true, motif:'flag',
    b:{x:3,y:3,w:7,h:5}, roof:'#c0392b',
    trays:[ {mode:'sell', x:10.2, y:3.4, w:2.0, h:4.2} ] },

  { id:'windmill', name:'WINDMILL', kind:'make', unlocked:false, motif:'sails',
    shape:'mill', b:{x:5.9,y:11.2,w:3.8,h:3.8}, roof:'#5b8ec4',
    recipes:[ { in:{wheat:2}, out:'flour', time:2.4 } ],
    trays:[ {mode:'in',  item:'wheat', x:10.2, y:10.9, w:2.0, h:1.9},
            {mode:'out', item:'flour', x:10.2, y:13.1, w:2.0, h:1.9} ] },

  { id:'coop', name:'CHICKEN COOP', kind:'make', unlocked:false, motif:'perch',
    shape:'shed', b:{x:5.8,y:17.1,w:4,h:3.4}, roof:'#e08a2e',
    recipes:[ { in:{wheat:2}, out:'egg', time:3.0 } ],
    trays:[ {mode:'in',  item:'wheat', x:10.2, y:16.9, w:2.0, h:1.9},
            {mode:'out', item:'egg',   x:10.2, y:19.1, w:2.0, h:1.9} ] },

  { id:'dairy', name:'DAIRY BARN', kind:'make', unlocked:false, motif:'silo',
    b:{x:4,y:23,w:6,h:4}, roof:'#b0453a',
    recipes:[ { in:{wheat:3}, out:'milk', time:3.6 } ],
    trays:[ {mode:'in',  item:'wheat', x:10.2, y:22.9, w:2.0, h:1.9},
            {mode:'out', item:'milk',  x:10.2, y:25.1, w:2.0, h:1.9} ] },

  { id:'cheese', name:'CHEESE CELLAR', kind:'make', unlocked:false, motif:'vent',
    b:{x:4,y:29,w:6,h:4}, roof:'#d9a441',
    recipes:[ { in:{milk:2}, out:'cheese', time:4.8 } ],
    trays:[ {mode:'in',  item:'milk',   x:10.2, y:28.9, w:2.0, h:1.9},
            {mode:'out', item:'cheese', x:10.2, y:31.1, w:2.0, h:1.9} ] },

  /* A plain pie takes an apple as well as an egg, so the pickers' fruit feeds
     the oven instead of piling up as jam. Four in-trays, hence the long row. */
  { id:'bakery', name:'BAKERY', kind:'make', unlocked:false, motif:'chimney',
    b:{x:3,y:35,w:7,h:5}, roof:'#8e5bb5',
    recipes:[ { in:{flour:1, cherry:2},        out:'cherrypie', time:6.0 },
              { in:{flour:1, egg:1, apple:1},  out:'pie',       time:5.2 } ],
    trays:[ {mode:'in',  item:'flour',  x:10.2, y:34.9, w:2.0, h:1.9},
            {mode:'in',  item:'egg',    x:10.2, y:37.1, w:2.0, h:1.9},
            {mode:'in',  item:'apple',  x:10.2, y:39.3, w:2.0, h:1.9},
            {mode:'in',  item:'cherry', x:10.2, y:41.5, w:2.0, h:1.9},
            {mode:'out', item:'pie',    x:10.2, y:43.7, w:2.0, h:1.9} ] },

  { id:'jam', name:'JAM KITCHEN', kind:'make', unlocked:false, motif:'chimney',
    b:{x:4,y:48,w:6,h:4}, roof:'#c2447a',
    recipes:[ { in:{cherry:3}, out:'cherryjam', time:5.2 },

/* ------------------------------------------------------------ game state */
let G, actors, flyers, pops, puffs, coinFx, customers;

function padCost(p){ const l=G.up[p.id]||0; return Math.round(p.cost*Math.pow(p.mul,l)); }
function capAt(l){ return Math.min(400, Math.round(12 + 14*l + 0.3*l*l)); }  // 12, 26, 41 ... 400
function capacity(){ return capAt(G.up.bag); }
function harvestRate(){ return 2.6 * (1 + 0.35*G.up.scythe); }
function yieldPer(){ return 1 + Math.floor(G.up.scythe/2); }
function regrowTime(p){ return p.regrow / (1 + 0.30*G.up.field); }
function moveSpeed(){ return 5.0 * (1 + 0.15*G.up.boots); }
function carried(a){ let n=0; for(const k of ITEM_ORDER) n += a.carry[k]; return n; }
function patchOpen(p){ return !p.gate || G.up[p.gate] > 0; }

function newActor(x,y,hand,lazy,job){
  return { x, y, vx:0, vy:0, face:2.2, bob:0, hand:!!hand, job: job || (hand?'field':'player'),
           lazy: !!hand && job!=='stall' && (lazy === undefined ? Math.random() < 0.5 : !!lazy),
           work: rnd(16,26), napT:0,
           carry:emptyBag(), cut:0, state:'seek', target:null, wait:0,
           tint: hand ? ['#4e7fd4','#d4684e','#5fb04e','#b45fd4','#d4a44e'][((typeof actors!=='undefined'&&actors)?actors.length:0)%5] : '#e2574c' };
}

function resetGame(){
  G = { coins:START_COINS, earned:0, level:1, up:{}, paid:{}, hands:0, handLazy:[], pickerLazy:[],
        stock:emptyBag(), till:0, cos:{}, wear:{}, party:null, t:0,
        sound:true, seenHint:{}, won:false, story:{}, journal:[], orders:[] };
  for(const id of UPGRADE_IDS) G.up[id] = 0;
  for(const p of PADS) G.paid[p.id]=0;

  for(const p of PATCHES){
    p.cols = Math.floor(p.rect.w / p.cell);
    p.rows = Math.floor(p.rect.h / p.cell);
    p.nodes = [];
    for(let j=0;j<p.rows;j++) for(let i=0;i<p.cols;i++)
      p.nodes.push({ x:p.rect.x + (i+0.5)*p.cell, y:p.rect.y + (j+0.5)*p.cell,
                     ripe:true, t:0, seed:Math.random()*6.28, grow:1 });
  }

  for(const s of STATIONS){
    s.unlocked = (s.id==='market');
    s.timer = 0; s.job = null;
    s.bin = emptyBag();
    s.pend = emptyBag();
    s.out = emptyBag();
  }
  actors  = [ newActor(16.2, 11.0, false) ];
  flyers = []; pops = []; puffs = []; coinFx = []; customers = [];
  stockPend = emptyBag();
  for(let i=0;i<7;i++) customers.push(newCustomer(i));
  refreshOrders();
  shake = 0;
  save();
}
const player = ()=> actors[0];

/* -------------------------------------------------------------- customers
   Villagers walk the road, queue at the farm stand and buy what they want. */
function availableItems(){
  const have = new Set();
  for(const p of PATCHES) if(patchOpen(p)) have.add(p.item);
  // repeat so a good made from a made good (cherry pie needs flour) is counted
  for(let pass=0; pass<4; pass++)
    for(const s of STATIONS){
      if(!s.unlocked || s.kind!=='make') continue;
      for(const r of s.recipes)
        if(Object.keys(r.in).every(k => have.has(k))) have.add(r.out);
    }
  return ITEM_ORDER.filter(k => have.has(k));
}
const wantedItems = availableItems;
function newCustomer(i){
  const c = { tint:['#4e7fd4','#d4684e','#5fb04e','#e0b23c','#9b59b6','#16a085','#e67e22'][i%7],
              carry:emptyBag(), cut:0, bob:0, moving:false, face:2.2,
              x:34.3+rnd(-.5,.5), y:MAP.h-2-i*1.8, slot:-1, order:i, happy:0 };
  resetCustomer(c, true);
  return c;
}
function resetCustomer(c, first){
  const pool = wantedItems();
  c.want  = pool[Math.floor(rnd(0,pool.length))];
  c.n     = 1 + Math.floor(rnd(0, c.want==='wheat' ? 3 : 2));
  c.state = 'walk';
  c.slot  = -1;
  if(!first){ c.x = 34.3+rnd(-.5,.5); c.y = MAP.h-1.5; }
}

function updateCustomers(dt){
  // hand out queue slots, nearest customer to the front
  for(let i=0;i<QUEUE.length;i++){
    if(customers.some(c=>c.slot===i)) continue;
    let best=null;
    for(const c of customers) if(c.state==='walk' && c.slot<0 && (!best || c.y<best.y)) best=c;
    if(best) best.slot = i;
  }
  let holding = 0;
  for(const c of customers){
    let tx=c.x, ty=c.y, speed=1.7;
    if(c.state==='leave'){
      /* Home is back down the road they came up. Leaving northwards walked
         them straight through the stand and the stall. */
      speed = 2.2;
      tx = LEAVE_LANE;
      ty = Math.abs(c.x - LEAVE_LANE) > 0.3 && c.y < QUEUE[0].y + 3 ? c.y : MAP.h + 0.5;
      if(c.y > MAP.h - 1.0){ resetCustomer(c); continue; }
    } else if(c.slot>=0){
      tx = QUEUE[c.slot].x; ty = QUEUE[c.slot].y;
    } else {
      tx = 34.3; ty = QUEUE[QUEUE.length-1].y + 2.2 + (holding++)*1.7;   // wait in line
    }
    const dx=tx-c.x, dy=ty-c.y, m=Math.hypot(dx,dy);
    if(m > 0.12){
      c.x += dx/m*speed*dt; c.y += dy/m*speed*dt;
      c.bob += dt*speed*3.4; c.moving = true;
      c.face = Math.atan2(dy,dx);
    } else {
      c.moving = false;
      if(c.state==='walk' && c.slot>=0) c.state = 'wait';
    }
    if(c.happy>0) c.happy -= dt;
  }
}

function hasKeeper(){ return G.up.keeper > 0; }
function stockTotal(){ let n=0; for(const k of ITEM_ORDER) n += G.stock[k]; return n; }

/* Parcels already thrown at the stall but not yet landed. Stock only goes up
   in the flyer's callback, so without this the loop keeps unloading against a
   figure that is seconds out of date and sails past the cap -- the same trap
   the trays avoid with their own pend counters. Not saved: it is always empty
   between sessions, because flyers do not survive a reload.               */
let stockPend = emptyBag();
const stockRoom = k => STOCK_CAP - G.stock[k] - stockPend[k];

/* With a keeper hired the stand pad becomes a bulk drop-off: you unload, they sell. */
function stockStand(a, dt){
  if(!inRect(a, STAND) || carried(a) <= 0) return false;
  hint('stockit','Leave goods here \u2014 the keeper sells them off for you');
  const step0 = flowStep(actorCap(a));
  let did = false;
  while(a.ioT >= IO_INTERVAL){
    const k = ITEM_ORDER.find(k => a.carry[k] > 0 && stockRoom(k) > 0);
    if(!k) break;
    a.ioT -= IO_INTERVAL;
    const step = Math.min(a.carry[k], Math.max(1, Math.min(step0, Math.ceil(a.carry[k]/8))), stockRoom(k));
    a.carry[k] -= step; stockPend[k] += step;
    const dst = { x: STALL.x + STALL.w/2, y: STALL.y + STALL.h/2 };
    itemFlyer(k, {x:a.x, y:a.y}, dst, (n=>()=>{ stockPend[k] -= n; G.stock[k] += n; })(step));
    did = true;
  }
  return did;
}

/* The keeper works the queue from stock, at the same over-market price. */
function keeperServe(dt){
  if(!hasKeeper() || stockTotal() <= 0) return;
  G.keeperT = (G.keeperT || 0) + dt;
  while(G.keeperT >= 0.28){
    const c = customers.find(c => c.state==='wait' && c.n > 0 && G.stock[c.want] > 0);
    if(!c) { G.keeperT = 0; return; }
    G.keeperT -= 0.28;
    const step = Math.min(c.n, G.stock[c.want], 4);
    G.stock[c.want] -= step; c.n -= step;
    const pay = standPrice(c.want) * step, cx = c.x, cy = c.y;
    itemFlyer(c.want, keeperSpot(), {x:cx, y:cy}, ()=>{
      G.coins += pay; G.earned += pay;
      spawnCoinFx(); sfx.coin();
      pops.push({x:cx, y:cy, z:1.5, t:0, txt:'+'+fmt(pay), col:'#7dff8d'});
      checkLevel();
    });
    if(c.n <= 0){
      c.state='leave'; c.slot=-1; c.happy=1.4;
      for(let i=0;i<8;i++) puffs.push({x:cx,y:cy,z:1.0,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),vz:rnd(1.5,3.5),
        t:0,life:rnd(.4,.8),col:['#ffe066','#8ef07a','#ff9de0'][i%3],r:rnd(2,4)});
    }
  }
}

/* serve the front of the queue — player only, the farmhands never touch it */
function serveStand(a, dt){
  if(hasKeeper()) return stockStand(a, dt);     // the keeper does the selling now
  if(!inRect(a, STAND)) return false;
  const waiting = customers.filter(c=>c.state==='wait' && c.n>0);
  if(waiting.length) hint('stand','Villagers pay '+Math.round((STAND_BONUS-1)*100)+'% over market for what they ask for');
  let served = false;
  while(a.ioT >= IO_INTERVAL){
    const c = waiting.find(c=>c.n>0 && a.carry[c.want]>0);
    if(!c) break;
    a.ioT -= IO_INTERVAL;
    const step = Math.min(a.carry[c.want], c.n, flowStep(c.n));
    a.carry[c.want] -= step; c.n -= step;
    served = true;
    const pay = standPrice(c.want)*step, cx = c.x, cy = c.y;
    itemFlyer(c.want, {x:a.x,y:a.y}, {x:cx,y:cy}, ()=>{
      G.coins += pay; G.earned += pay;
      spawnCoinFx(); sfx.coin();
      pops.push({x:cx, y:cy, z:1.5, t:0, txt:'+'+pay, col:'#7dff8d'});
      checkLevel();
    });
    if(c.n<=0){
      c.state='leave'; c.slot=-1; c.happy=1.4;
      for(let i=0;i<10;i++) puffs.push({x:cx,y:cy,z:1.0,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),vz:rnd(1.5,3.5),
        t:0,life:rnd(.4,.8),col:['#ffe066','#8ef07a','#ff9de0'][i%3],r:rnd(2,4)});
    }
  }
  return served;
}

/* -------------------------------------------------------------- persistence */
const SAVE_KEY = 'harvest-hero-v1';

/* A save is a plain object. localStorage and the save file carry the same
   thing, so anything that round-trips through one round-trips through both. */
const START_COINS = 25;

function saveData(){
  return {
    game:'harvest-hero', format:3,
    savedAt:new Date().toISOString(), level:G.level,
    coins:G.coins, earned:G.earned, up:G.up, paid:G.paid, hands:G.hands,
    handLazy:G.handLazy, pickerLazy:G.pickerLazy, stock:G.stock, till:G.till,
    cos:G.cos, wear:G.wear,
    sound:G.sound, seenHint:G.seenHint, won:G.won,
    story:G.story, journal:G.journal, orders:G.orders };
}

/* ---- save envelope -----------------------------------------------------
   The payload is scrambled and stamped so a save cannot be edited in a text
   editor. This is tamper-EVIDENCE, not security: everything needed to forge
   a stamp is in this file, and anyone with the console can set G.coins
   directly. It stops casual editing, which is all a client-side game can do.
   The second line of defence is sanitiseSave(), which throws away any value
   the game itself could never have produced.                              */
const STAMP_KEY = [0x5a,0x1c,0x7e,0x33,0xb2,0x6d,0x94,0xc8,0x21,0x4f,0xe3,0x08,0x77,0xa5];
const STAMP_SALT = 'hollowbrook-mill-turns-again';

function stamp(str){
  let h1 = 0xdeadbeef ^ 0x48484, h2 = 0x41c6ce57 ^ 0x48484;
  const s = str + STAMP_SALT;
  for(let i=0; i<s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36);
}
function pack(json){
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i] ^ STAMP_KEY[i % STAMP_KEY.length]);
  return btoa(bin);
}
function unpack(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i) ^ STAMP_KEY[i % STAMP_KEY.length];
  return new TextDecoder().decode(bytes);
}
function encodeSave(obj){
  const d = pack(JSON.stringify(obj));
  return JSON.stringify({ game:'harvest-hero', format:3, d, s:stamp(d) });
}
/* -> { data } | { error } | { legacy } */
function decodeSave(text){
  let env;
  try{ env = JSON.parse(text); }
  catch(e){ return { error:'That is not a save file \u2014 check the whole thing was copied.' }; }
  if(!env || typeof env !== 'object' || Array.isArray(env))
    return { error:'That file does not contain a save.' };
  if(typeof env.d !== 'string' || typeof env.s !== 'string'){
    if(env.coins !== undefined || env.up) return { legacy:env };
    return { error:'That does not look like a Harvest Hero save.' };
  }
  if(stamp(env.d) !== env.s)
    return { error:'That save has been edited, so it will not load.' };
  try{ return { data: JSON.parse(unpack(env.d)) }; }
  catch(e){ return { error:'That save is damaged and cannot be read.' }; }
}

/* ---- keep only values the game could actually have produced ---- */
const intIn = (v, lo, hi)=>{
  const n = Math.floor(Number(v));
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo;
};
function sanitiseSave(d){
  const out = {};
  out.up = {};
  for(const pad of PADS) out.up[pad.id] = intIn((d.up||{})[pad.id], 0, pad.max);

  out.earned = intIn(d.earned, 0, 1e15);
  // every coin earned is added to `earned`, and spending only removes coins,
  // so coins can never exceed the lifetime total plus the starting purse
  out.coins  = intIn(d.coins, 0, out.earned + START_COINS);

  // farmhands are exactly the times that pad was bought
  out.hands  = out.up.hand;
  out.handLazy = [];
  for(let i=0;i<out.hands;i++){
    const v = Array.isArray(d.handLazy) ? d.handLazy[i] : undefined;
    out.handLazy.push(v === undefined ? Math.random() < 0.5 : !!v);   // older saves roll now
  }
  out.pickerLazy = [];
  for(let i=0;i<out.up.pickers;i++){
    const v = Array.isArray(d.pickerLazy) ? d.pickerLazy[i] : undefined;
    out.pickerLazy.push(v === undefined ? Math.random() < 0.5 : !!v);
  }
  out.stock = emptyBag();
  for(const k of ITEM_ORDER) out.stock[k] = intIn((d.stock||{})[k], 0, STOCK_CAP);
  out.till = intIn(d.till, 0, 1e12);
  out.cos = {}; out.wear = {};
  const shopIds = COSMETICS.map(c=>c.id).concat(['party']);
  for(const id of shopIds) if((d.cos||{})[id]) out.cos[id] = 1;
  for(const c of COSMETICS) if((d.wear||{})[c.slot] === c.id && out.cos[c.id]) out.wear[c.slot] = c.id;

  out.paid = {};
  for(const pad of PADS){
    const lvl  = out.up[pad.id];
    const cost = Math.round(pad.cost * Math.pow(pad.mul, lvl));
    out.paid[pad.id] = lvl >= pad.max ? 0 : intIn((d.paid||{})[pad.id], 0, Math.max(0, cost-1));
  }

  out.sound = (d.sound !== false);
  out.won   = !!d.won;

  const ids = STORY.map(c=>c.id);
  out.story = {};
  for(const id of ids) if((d.story||{})[id]) out.story[id] = 1;
  out.journal = Array.isArray(d.journal) ? d.journal.filter(id=>ids.includes(id)) : [];
  out.seenHint = (d.seenHint && typeof d.seenHint === 'object' && !Array.isArray(d.seenHint)) ? d.seenHint : {};

  // orders keep their goods but never their payout: that is recomputed here
  out.orders = [];
  if(Array.isArray(d.orders)) for(const o of d.orders.slice(0,2)){
    if(!o || typeof o !== 'object') continue;
    const items = {}, need = {};
    for(const k of ITEM_ORDER){
      const q = intIn((o.items||{})[k], 0, 5000);
      if(q > 0){ items[k] = q; need[k] = intIn((o.need||{})[k], 0, q); }
    }
    if(!Object.keys(items).length) continue;
    let pay = 0;
    for(const k in items) pay += ITEMS[k].price * items[k];
    out.orders.push({ items, need, pay: Math.round(pay * ORDER_BONUS) });
  }

  /* Deliberately NOT checked: that the upgrade levels are affordable out of
     `earned`. Computing that needs the cost table, which changes whenever the
     game is rebalanced, so a farm played across a balance change fails it and
     the player loses everything. The coins clamp above is the same idea
     without that flaw: it follows from how coins move, not from any number
     that might be retuned later. */
  return out;
}

function save(){
  try{ localStorage.setItem(SAVE_KEY, encodeSave(saveData())); }catch(e){}
}
let saveNotice = null;
function rejectStored(text, why){
  // keep the bad blob rather than letting the next autosave bury it
  try{ localStorage.setItem(SAVE_KEY + '-rejected', text); localStorage.removeItem(SAVE_KEY); }catch(e){}
  saveNotice = why;
}
function load(){
  let text=null; try{ text = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!text) return;
  const r = decodeSave(text);
  if(r.error){ rejectStored(text, r.error + ' Starting a new farm.'); return; }
  // a farm already in progress from an older build is migrated, then re-stamped
  const d = r.data || r.legacy;
  if(!d) return;
  applySave(sanitiseSave(d));
  if(r.legacy) save();
}
function applySave(d){
  G.coins=d.coins|0; G.earned=d.earned|0; G.hands=d.hands|0;
  Object.assign(G.up, d.up||{}); Object.assign(G.paid, d.paid||{});
  G.sound = d.sound!==false; G.seenHint = d.seenHint||{}; G.won=!!d.won;
  G.story = d.story||{}; G.journal = d.journal||[];
  G.handLazy = Array.isArray(d.handLazy) ? d.handLazy.slice() : [];
  G.pickerLazy = Array.isArray(d.pickerLazy) ? d.pickerLazy.slice() : [];
  G.stock = Object.assign(emptyBag(), d.stock || {});
  stockPend = emptyBag();          // nothing is in the air across a load
  G.till = d.till | 0;
  G.cos = d.cos || {}; G.wear = d.wear || {};

  /* Saves from before the valley expanded: a bakery used to run on raw wheat,
     so grant the mill that now feeds it rather than stranding the player. */
  if(G.up.bakery>0 && !G.up.windmill) G.up.windmill = 1;

  G.level = 1; while(G.earned >= levelReq(G.level)) G.level++;
  for(const s of STATIONS) if(s.id!=='market') s.unlocked = (G.up[s.id]||0)>0;
  G.orders = Array.isArray(d.orders) && d.orders.length ? d.orders : [];
  refreshOrders();
  for(let i=0;i<G.hands;i++){
    if(G.handLazy[i] === undefined) G.handLazy[i] = Math.random() < 0.5;
    actors.push(newActor(20+rnd(-1,1), 11+rnd(-1,1), true, G.handLazy[i], 'field'));
  }
  for(let i=0;i<(G.up.pickers||0);i++){
    if(G.pickerLazy[i] === undefined) G.pickerLazy[i] = Math.random() < 0.5;
    actors.push(newActor(PATCHES[1].rect.x+2+rnd(-1,1), PATCHES[1].rect.y+2+rnd(-1,1),
                         true, G.pickerLazy[i], 'orchard'));
  }
  if(G.up.keeper > 0) actors.push(newActor(keeperSpot().x, keeperSpot().y, true, false, 'stall'));
}

/* ---- save files -------------------------------------------------------
   Download is blocked in some sandboxed embeds, so the same text is always
   shown for copy/paste as well; either route restores the same farm.      */
function saveFileName(){
  return 'harvest-hero-level-' + G.level + '-' + new Date().toISOString().slice(0,10) + '.json';
}
function exportSave(){
  save();
  const text = encodeSave(saveData());
  try{
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = saveFileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    return true;
  }catch(e){ return false; }
}
function importSave(text){
  const r = decodeSave(text);
  if(r.error) return r.error;
  if(r.legacy) return 'That save is from an older version and cannot be imported.';
  const clean = sanitiseSave(r.data);
  const keepSound = G.sound;
  resetGame();
  applySave(clean);
  G.sound = keepSound;
  const q = iso(player().x, player().y); cam.x = q.sx; cam.y = q.sy;
  buildPills(); syncHUD(); save();
  return null;
}

/* -------------------------------------------------------------- audio */
let AC=null;
function beep(freq, dur, type, vol, slide){
  if(!G.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq, AC.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), AC.currentTime+dur);
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.05, AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
const sfx = {
  cut:  ()=>beep(rnd(280,340), .07, 'sawtooth', .035, 140),
  pick: ()=>beep(rnd(620,760), .06, 'triangle', .04),
  coin: ()=>beep(rnd(880,1180), .09, 'square', .035, 1500),
  buy:  ()=>{ beep(523,.1,'square',.06); setTimeout(()=>beep(659,.1,'square',.06),90);
              setTimeout(()=>beep(784,.18,'square',.06),180); },
  levelup: ()=>{ beep(660,.1,'triangle',.07); setTimeout(()=>beep(880,.2,'triangle',.07),110); },
};

/* -------------------------------------------------------------- input */
const keys = {};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()]=false; });

const stick = { on:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0 };
function stickStart(id,x,y){ stick.on=true; stick.id=id; stick.ox=x; stick.oy=y; stick.x=x; stick.y=y; if(AC&&AC.state==='suspended')AC.resume(); }
function stickMove(x,y){
  stick.x=x; stick.y=y;
  let dx=x-stick.ox, dy=y-stick.oy;
  const R=70, m=Math.hypot(dx,dy);
  if(m>R){ stick.ox += dx*(1-R/m); stick.oy += dy*(1-R/m); dx*=R/m; dy*=R/m; }
  stick.dx=dx/R; stick.dy=dy/R;
}
function stickEnd(){ stick.on=false; stick.id=null; stick.dx=0; stick.dy=0; }

cvs.addEventListener('pointerdown', e=>{ cvs.setPointerCapture(e.pointerId); stickStart(e.pointerId,e.clientX,e.clientY); });
cvs.addEventListener('pointermove', e=>{ if(stick.on && e.pointerId===stick.id) stickMove(e.clientX,e.clientY); });
cvs.addEventListener('pointerup',     e=>{ if(e.pointerId===stick.id) stickEnd(); });
cvs.addEventListener('pointercancel', e=>{ if(e.pointerId===stick.id) stickEnd(); });

/* screen-space input vector -> world-space direction (isometric) */
function inputDir(){
  let sx=0, sy=0;
  if(keys['a']||keys['arrowleft'])  sx-=1;
  if(keys['d']||keys['arrowright']) sx+=1;
  if(keys['w']||keys['arrowup'])    sy-=1;
  if(keys['s']||keys['arrowdown'])  sy+=1;
  if(sx||sy){ const m=Math.hypot(sx,sy); sx/=m; sy/=m; }
  else if(stick.on){ sx=stick.dx; sy=stick.dy; const m=Math.hypot(sx,sy); if(m>1){sx/=m;sy/=m;} }
  if(!sx && !sy) return {x:0,y:0,m:0};
  const wx = sx/(TW/2) + sy/(TH/2);
  const wy = sy/(TH/2) - sx/(TW/2);
  const wm = Math.hypot(wx,wy);
  const m  = Math.min(1, Math.hypot(sx,sy));
  return { x:wx/wm, y:wy/wm, m };
}

/* =======================================================================
   UPDATE
   ===================================================================== */
let shake = 0, hintTimer = 0;
const IO_INTERVAL = 0.06;
/* Any transfer completes in roughly 50 ticks whatever its size, so a 1000-item
   haul empties as fast as a 12-item one — each flyer just carries more. */
const flowStep = total => Math.max(1, Math.ceil(total/50));

function inRect(a, r){ return a.x>r.x && a.x<r.x+r.w && a.y>r.y && a.y<r.y+r.h; }
function rectCenter(r){ return { x:r.x+r.w/2, y:r.y+r.h/2 }; }
function station(id){ return STATIONS.find(s=>s.id===id); }

function collide(a){
  for(const s of STATIONS){
    if(!s.unlocked) continue;
    const b=s.b, r=0.45;
    if(a.x>b.x-r && a.x<b.x+b.w+r && a.y>b.y-r && a.y<b.y+b.h+r){
      const dl=a.x-(b.x-r), dr=(b.x+b.w+r)-a.x, du=a.y-(b.y-r), dd=(b.y+b.h+r)-a.y;
      const m=Math.min(dl,dr,du,dd);
      if(m===dl) a.x=b.x-r; else if(m===dr) a.x=b.x+b.w+r;
      else if(m===du) a.y=b.y-r; else a.y=b.y+b.h+r;
    }
  }
  a.x = clamp(a.x, 1, MAP.w-1.2);
  a.y = clamp(a.y, 1, MAP.h-1.2);
}

function moveActor(a, dx, dy, mag, dt){
  const sp = moveSpeed() * (a.hand?0.5:1) * mag;    // hired help is not you
  const ax = dx*sp, ay = dy*sp;
  a.vx = lerp(a.vx, ax, 1-Math.pow(0.0008, dt));
  a.vy = lerp(a.vy, ay, 1-Math.pow(0.0008, dt));
  a.x += a.vx*dt; a.y += a.vy*dt;
  collide(a);
  const spd = Math.hypot(a.vx,a.vy);
  if(spd>0.25){
    a.bob += dt*spd*3.4;
    const want = Math.atan2(a.vy, a.vx);
    let d = want - a.face;
    while(d> Math.PI) d-=Math.PI*2;
    while(d<-Math.PI) d+=Math.PI*2;
    a.face += d * (1-Math.pow(0.0001, dt));
  } else a.bob = lerp(a.bob, 0, 1-Math.pow(0.001,dt));
  a.moving = spd>0.25;
}

function patchAt(x,y){
  for(const p of PATCHES){
    const r=p.rect;
    if(patchOpen(p) && x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h) return p;
  }
  return null;
}

/* A hired pair of hands carries a share of yours, and never more than 80:
   past that a single hand empties a grove between naps. */
function actorCap(a){ return a.hand ? clamp(Math.round(capacity()*0.35), 12, 80) : capacity(); }
function reach(){ return 0.75 + 0.15*G.up.scythe; }

function nodesAround(p, x, y, R){
  const out = [], r = p.rect;
  const i0=Math.max(0,Math.floor((x-R-r.x)/p.cell)), i1=Math.min(p.cols-1,Math.floor((x+R-r.x)/p.cell));
  const j0=Math.max(0,Math.floor((y-R-r.y)/p.cell)), j1=Math.min(p.rows-1,Math.floor((y+R-r.y)/p.cell));
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const t = p.nodes[j*p.cols+i];
    if(dist2(x,y,t.x,t.y) <= R*R) out.push(t);
  }
  return out;
}

function tryHarvest(a, dt){
  const p = patchAt(a.x, a.y);
  if(!p){ a.cut = 0; return false; }
  const R = reach() + (p.kind==='tree' ? 0.7 : 0);      // trees are wide, reach into them
  const room = actorCap(a) - carried(a);
  const near = nodesAround(p, a.x, a.y, R).filter(t=>t.ripe);
  if(!near.length){ a.cut = 0; return false; }
  if(room <= 0){
    if(!a.hand) hint('bagfull', 'BAG FULL \u2014 go sell it!');
    a.cut = 0; return false;
  }
  a.cut += dt * harvestRate() * (a.hand ? 0.45 : (p.pickMul || 1));
  if(a.cut < 1) return false;
  a.cut = 0;

  near.sort((q,r)=> dist2(a.x,a.y,q.x,q.y) - dist2(a.x,a.y,r.x,r.y));
  const per = yieldPer() * p.yieldMul;
  let gained = 0;
  for(const t of near){
    if(gained + per > room && gained > 0) break;
    t.ripe = false; t.grow = 0; t.t = regrowTime(p)*rnd(0.8,1.2);
    const g = Math.min(per, room - gained);
    gained += g;
    const col = p.kind==='tree' ? '#d8402f' : '#f7d24a';
    for(let i=0;i<4;i++) puffs.push({x:t.x, y:t.y, z:p.kind==='tree'?1.4:0.2,
      vx:rnd(-1,1), vy:rnd(-1,1), vz:rnd(1.4,2.6), t:0, life:rnd(.35,.6), col, r:rnd(2,4)});
    if(gained >= room) break;
  }
  a.carry[p.item] += gained;
  if(!a.hand && gained>0){
    sfx.cut();
    pops.push({x:a.x, y:a.y, z:1.0, t:0, txt:'+'+gained, col:'#ffe066'});
    hint('sell','Bag getting full? Sell it at the MARKET up north');
  }
  return true;
}

function trayWorld(s, tr){ return { x:tr.x+tr.w/2, y:tr.y+tr.h/2 }; }

function itemFlyer(item, from, to, onDone){
  flyers.push({ item, x0:from.x, y0:from.y, x1:to.x, y1:to.y, t:0, dur:0.34,
                h:rnd(1.6,2.4), spin:rnd(-6,6), onDone });
}

/* The takings, wherever the player collects them from. */
function collectTill(){
  if(G.till < 1) return 0;
  const take = Math.round(G.till); G.till = 0;
  G.coins += take; G.earned += take;
  sfx.buy(); checkLevel(); save();
  const a = player();
  for(let i=0;i<10;i++) setTimeout(()=>spawnCoinFx(), i*45);
  pops.push({x:a.x, y:a.y, z:1.6, t:0, txt:'+'+fmt(take), col:'#ffe066', big:true});
  return take;
}

/* interaction with station trays: unload / pick up / sell */
function tryStations(a, dt){
  a.ioT = (a.ioT||0) + dt;
  if(!a.hand && bagOpen) return;                  // the panel is doing the carrying
  if(!a.hand && inRect(a, TILL_PAD)) collectTill();
  if(!a.hand && serveStand(a, dt)) return;
  if(!a.hand && serveBoard(a, dt)) return;
  for(const s of STATIONS){
    if(!s.unlocked) continue;
    for(const tr of s.trays){
      if(!inRect(a, tr)) continue;

      if(tr.mode==='sell'){
        if(!a.hand) collectTill();
        if(carried(a)<=0) continue;
        const step0 = flowStep(actorCap(a));   // constant, so the stack always drains
        while(a.ioT >= IO_INTERVAL && carried(a)>0){
          a.ioT -= IO_INTERVAL;
          // the priciest thing actually in the bag. Never assume an item is
          // there: subtracting from an empty stack drives it negative, which
          // silently pays wheat rates for cheese and breaks every count.
          let it = null, best = -1;
          for(const k of ITEM_ORDER)
            if(a.carry[k] > 0 && ITEMS[k].price > best){ best = ITEMS[k].price; it = k; }
          if(!it) break;
          // never in fewer than ~8 parcels, so even a small load still streams
          const step = Math.max(1, Math.min(a.carry[it], step0, Math.ceil(a.carry[it]/8)));
          a.carry[it] -= step;
          const price = ITEMS[it].price * step;
          const p = {x:a.x, y:a.y};
          const byHand = a.hand;
          itemFlyer(it, p, rectCenter({x:s.b.x,y:s.b.y,w:s.b.w,h:s.b.h}), ()=>{
            if(byHand){
              // a farmhand's takings wait in the till; constant coin flashes
              // for someone else's work is just noise
              G.till += price;
            } else {
              G.coins += price; G.earned += price;
              spawnCoinFx(); sfx.coin();
              pops.push({x:a.x,y:a.y,z:1.3,t:0,txt:'+'+fmt(price),col:'#7dff8d'});
              checkLevel();
            }
          });
        }
        hint('pad','Coins pay for UPGRADES — stand on a glowing pad');
        return;
      }

      if(tr.mode==='in'){
        const it = tr.item;
        if(a.carry[it]<=0 || s.bin[it]+s.pend[it]>=TRAY_CAP) continue;
        const step0 = flowStep(TRAY_CAP);
        while(a.ioT >= IO_INTERVAL && a.carry[it]>0 && s.bin[it]+s.pend[it]<TRAY_CAP){
          a.ioT -= IO_INTERVAL;
          const step = Math.min(a.carry[it], step0, TRAY_CAP - s.bin[it] - s.pend[it]);
          a.carry[it] -= step; s.pend[it] += step;
          const p={x:a.x,y:a.y}, dst=trayWorld(s,tr);
          itemFlyer(it, p, dst, ()=>{ s.pend[it]-=step; s.bin[it]+=step; });
          if(!a.hand) sfx.pick();
        }
        return;
      }

      if(tr.mode==='out'){
        // Farmhands must not lift finished goods: nothing they carry but wheat
        // can be unloaded anywhere they walk, so a stray pie would strand them.
        if(a.hand) continue;
        if(outTotal(s)<=0 || carried(a)>=actorCap(a)) continue;
        const step0 = flowStep(TRAY_CAP);
        while(a.ioT >= IO_INTERVAL && outTotal(s)>0 && carried(a)<actorCap(a)){
          a.ioT -= IO_INTERVAL;
          const it = ITEM_ORDER.find(k => s.out[k] > 0);
          if(!it) break;
          const step = Math.min(s.out[it], step0, actorCap(a)-carried(a));
          s.out[it] -= step;
          const src=trayWorld(s,tr);
          a.carry[it] += step;
          itemFlyer(it, src, {x:a.x,y:a.y}, null);
          sfx.pick();
        }
        return;
      }
    }
  }
  if(a.ioT > 0.5) a.ioT = 0;
}

function outTotal(s){ let n=0; for(const k of ITEM_ORDER) n += s.out[k]; return n; }

function produce(dt){
  for(const s of STATIONS){
    if(!s.unlocked || s.kind!=='make') continue;
    /* A workshop with two recipes tosses a coin between the ones it can make.
       Taking them in order meant the cherry version always won, so the plain
       one was never made at all once the grove was planted. The choice is
       held until the batch comes out, or the timer would count against a
       recipe that keeps changing under it. */
    const ready = s.recipes.filter(r => Object.keys(r.in).every(k => s.bin[k] >= r.in[k]));
    if(!ready.includes(s.job)) s.job = ready.length ? ready[Math.floor(rnd(0,ready.length))] : null;
    const r = s.job;
    const room = TRAY_CAP - outTotal(s);
    if(r && room > 0){
      s.timer += dt;
      if(s.timer >= r.time){
        s.timer = 0; s.job = null;
        let batch = 1 + G.up.crew;
        for(const k in r.in) batch = Math.min(batch, Math.floor(s.bin[k] / r.in[k]));
        batch = Math.max(1, Math.min(batch, room));
        for(const k in r.in) s.bin[k] -= r.in[k] * batch;
        s.out[r.out] += batch;
        const c = {x:s.b.x+s.b.w/2, y:s.b.y+s.b.h/2};
        puffs.push({x:c.x,y:c.y,z:2.2,vx:0,vy:0,vz:1.6,t:0,life:.5,col:'#ffffff',r:5});
      }
    } else s.timer = 0;
  }
}

/* ------------------------------------------------------------ upgrade pads */
function visiblePads(){ return PADS.filter(p => (G.up[p.id]||0) < p.max && p.show()); }

function updatePads(dt){
  const a = player();
  for(const p of PADS){
    p.active = false;
    if((G.up[p.id]||0) >= p.max || !p.show()) continue;
    if(dist2(a.x,a.y,p.x,p.y) < 1.1*1.1){
      p.active = true;
      const cost = padCost(p);
      const need = cost - G.paid[p.id];
      if(G.coins > 0 && need > 0){
        const rate = Math.max(14, (cost/1.8) * (0.4 + 1.2*(G.paid[p.id]/cost)));
        const amt = Math.min(rate*dt, G.coins, need);
        G.coins -= amt; G.paid[p.id] += amt;
        p.pulse = (p.pulse||0) + dt*14;
        if(!p.sT || G.t-p.sT>0.09){ p.sT=G.t; beep(300+520*(G.paid[p.id]/cost), .05, 'square', .03); }
        if(G.paid[p.id] >= cost-0.001) buyPad(p);
      }
    }
  }
}

function buyPad(p){
  G.paid[p.id] = 0;
  G.up[p.id] = (G.up[p.id]||0) + 1;
  sfx.buy(); shake = 9;
  pops.push({x:p.x, y:p.y, z:2.0, t:0, txt:p.name+'!', col:'#8ef07a', big:true});
  for(let i=0;i<26;i++) puffs.push({x:p.x,y:p.y,z:.4,vx:rnd(-3,3),vy:rnd(-3,3),vz:rnd(2,5.5),
    t:0,life:rnd(.5,1),col:['#ffe066','#8ef07a','#6fd0ff','#ff9de0'][i%4],r:rnd(2.5,5)});

  const st = STATIONS.find(x=>x.id===p.id);
  if(st){
    st.unlocked = true;
    const r = st.recipes && st.recipes[st.recipes.length-1];
    const ins = r ? Object.keys(r.in).map(k=>ITEMS[k].label.toLowerCase()).join(' + ') : '';
    hint('open'+p.id, st.name+' OPEN \u2014 ' + (r ? ins+' \u2192 '+ITEMS[r.out].label.toLowerCase() : 'ready'), true);
  }
  if(p.id==='orchard') hint('openorchard','The orchard is planted \u2014 walk under the trees to pick apples', true);
  if(p.id==='pickers'){
    const picker = newActor(PATCHES[1].rect.x+2, PATCHES[1].rect.y+2, true, undefined, 'orchard');
    G.pickerLazy.push(picker.lazy);
    actors.push(picker);
    hint('pickers', picker.lazy
      ? 'A picker joined the groves \u2014 this one looks like a napper.'
      : 'A picker joined \u2014 they work the apple and cherry groves.', true);
  }
  if(p.id==='keeper'){
    actors.push(newActor(keeperSpot().x, keeperSpot().y, true, false, 'stall'));
    hint('keeper','The stall keeper is in. Drop goods at the stand and they sell them for you.', true);
  }
  if(p.id==='hand'  ){
    G.hands++;
    const hand = newActor(p.x+rnd(-1,1), p.y+rnd(-1,1), true, undefined, 'field');
    G.handLazy.push(hand.lazy);
    actors.push(hand);
    hint('hand'+G.hands, hand.lazy
      ? 'A farmhand joined \u2014 though this one yawned all the way here.'
      : 'A farmhand joined! They work the wheat field for you.', true);
  }
  save();
}

/* ------------------------------------------------------------ farmhand AI */
function keeperSpot(){ return { x: STALL.x + STALL.w/2, y: STALL.y + STALL.h + 0.5 }; }

/* Route by what the actor is actually holding: any input tray that takes it and
   has room, emptiest first. The market is the fallback because it buys the lot,
   so a hand can never be left carrying something with nowhere to put it.      */
function deliveryTarget(a){
  let best = null, bestFill = 1e9;
  for(const st of STATIONS){
    if(!st.unlocked || st.kind!=='make') continue;
    for(const tr of st.trays){
      if(tr.mode !== 'in' || !a.carry[tr.item]) continue;
      const fill = st.bin[tr.item] + st.pend[tr.item];
      if(fill >= TRAY_CAP-2) continue;
      if(fill < bestFill){ bestFill = fill; best = tr; }
    }
  }
  return best || station('market').trays[0];
}

function updateHand(a, dt){
  if(a.job === 'stall'){                      // minds the stall, never leaves it
    const spot = keeperSpot();
    const dx = spot.x-a.x, dy = spot.y-a.y, m = Math.hypot(dx,dy);
    if(m > 0.15) moveActor(a, dx/m, dy/m, 1, dt); else moveActor(a, 0,0,0, dt);
    return;
  }
  a.think = (a.think||0) - dt;

  /* Half of the farmhands you hire are lazy. They put in a decent stretch,
     then down tools and sleep it off before getting up and carrying on. */
  if(a.lazy){
    if(a.state === 'nap'){
      a.napT -= dt;
      moveActor(a, 0, 0, 0, dt);
      if(a.napT <= 0){ a.state = 'seek'; a.target = null; a.work = rnd(16,26); }
      return;
    }
    a.work -= dt;
    if(a.work <= 0){
      a.state = 'nap'; a.napT = rnd(11,19);
      a.target = null; a.tray = null; a.cut = 0;
      const lost = carried(a);
      if(lost > 0){                       // down tools, and the load goes with them
        for(const k of ITEM_ORDER){
          if(!a.carry[k]) continue;
          const col = k==='wheat' ? '#f2cc3f' : k==='apple' ? '#d8402f' : '#efe3c6';
          for(let i=0;i<Math.min(8, a.carry[k]);i++)
            puffs.push({ x:a.x+rnd(-.5,.5), y:a.y+rnd(-.5,.5), z:rnd(.5,1.4),
                         vx:rnd(-2.2,2.2), vy:rnd(-2.2,2.2), vz:rnd(1,3),
                         t:0, life:rnd(.6,1.2), col, r:rnd(2.5,4.5) });
          a.carry[k] = 0;
        }
        pops.push({ x:a.x, y:a.y, z:1.2, t:0, txt:'dropped '+lost, col:'#ffb0a0' });
      }
      return;
    }
  }

  if(a.state==='seek'){
    if(carried(a) >= actorCap(a)){ a.state='deliver'; a.target=null; a.think=0; }
    else {
      if(!a.target || a.think<=0 || !a.target.ripe){
        a.think = 0.5;
        let best=null, bd=1e9;
        const want = a.job==='orchard' ? 'tree' : 'crop';
        for(const p of PATCHES){
          if(!patchOpen(p) || p.kind!==want) continue;
          for(const t of p.nodes){
            if(!t.ripe) continue;
            let d = dist2(a.x,a.y,t.x,t.y);
            for(const o of actors) if(o!==a && o.target===t) d += 30;
            if(d<bd){ bd=d; best=t; }
          }
        }
        a.target = best;
      }
      if(a.target){
        const dx=a.target.x-a.x, dy=a.target.y-a.y, m=Math.hypot(dx,dy);
        if(m>0.28) moveActor(a, dx/m, dy/m, 1, dt);
        else { moveActor(a,0,0,0,dt); tryHarvest(a, dt); }
      } else moveActor(a,0,0,0,dt);
    }
  } else {
    if(carried(a) <= 0){ a.state='seek'; a.target=null; a.think=0; a.stuck=0; return; }
    // if a load has not gone down in a while, stop trying to be clever about it
    const load = carried(a);
    a.stuck = (load === a.lastLoad) ? (a.stuck||0) + dt : 0;
    a.lastLoad = load;
    if(a.stuck > 10){ a.stuck = 0; a.tray = station('market').trays[0]; }
    else if(!a.tray || a.think<=0){ a.think=1.2; a.tray = deliveryTarget(a); }
    const c = rectCenter(a.tray);
    const dx=c.x-a.x, dy=c.y-a.y, m=Math.hypot(dx,dy);
    if(m>0.2) moveActor(a, dx/m, dy/m, 1, dt);
    else moveActor(a,0,0,0,dt);
    tryStations(a, dt);
  }
}

/* ------------------------------------------------------------ order board */
function makeOrder(){
  const pool = availableItems().filter(k=>k!=='wheat');
  if(!pool.length) pool.push('wheat');
  const kinds = pool.length>1 && Math.random()<0.55 ? 2 : 1;
  const picked = [], items = {};
  for(let i=0;i<kinds;i++){
    let k; let guard=0;
    do { k = pool[Math.floor(rnd(0,pool.length))]; } while(picked.includes(k) && ++guard<10);
    if(picked.includes(k)) continue;
    picked.push(k);
    const base = ITEMS[k].price;
    const qty = Math.max(2, Math.round((18 + G.level*4) / Math.sqrt(base)));
    items[k] = qty;
  }
  let pay = 0;
  for(const k in items) pay += ITEMS[k].price * items[k];
  return { items, need:Object.assign({}, items), pay:Math.round(pay*ORDER_BONUS) };
}
function orderKey(o){ return Object.keys(o.need).sort().join('+'); }
function refreshOrders(){
  G.orders = G.orders.filter(o => o && o.need && Object.keys(o.need).length);
  // an order posted before the farm could make anything better is not worth keeping
  if(availableItems().length > 1)
    G.orders = G.orders.filter(o => !(orderKey(o)==='wheat' && Object.keys(o.items).length===1));
  let guard = 0;
  while(G.orders.length < 2 && guard++ < 24){
    const o = makeOrder();
    if(G.orders.some(x => orderKey(x) === orderKey(o))) continue;
    G.orders.push(o);
  }
  while(G.orders.length < 2) G.orders.push(makeOrder());   // fall back rather than spin
}
function orderDone(o){ return Object.keys(o.need).every(k=>o.need[k]<=0); }

function serveBoard(a, dt){
  if(!inRect(a, BOARD)) return false;
  hint('board','The village posts orders here \u2014 they pay well over market');
  let did = false;
  while(a.ioT >= IO_INTERVAL){
    let hit = null, key = null;
    for(const o of G.orders){
      for(const k in o.need){
        if(o.need[k] > 0 && a.carry[k] > 0){ hit = o; key = k; break; }
      }
      if(hit) break;
    }
    if(!hit) break;
    a.ioT -= IO_INTERVAL;
    const step = Math.max(1, Math.min(a.carry[key], hit.need[key], flowStep(hit.items[key])));
    a.carry[key] -= step; hit.need[key] -= step;
    did = true;
    const c = rectCenter(BOARD);
    itemFlyer(key, {x:a.x,y:a.y}, c, null);
    if(orderDone(hit)){
      const pay = hit.pay;
      G.coins += pay; G.earned += pay;
      G.orders.splice(G.orders.indexOf(hit), 1);
      G.orders.push(makeOrder());
      sfx.buy(); shake = Math.max(shake, 7);
      pops.push({x:c.x, y:c.y, z:2.2, t:0, txt:'ORDER FILLED +$'+fmt(pay), col:'#8ef07a', big:true});
      for(let i=0;i<20;i++) puffs.push({x:c.x,y:c.y,z:.6,vx:rnd(-3,3),vy:rnd(-3,3),vz:rnd(2,5),
        t:0,life:rnd(.5,1),col:['#ffe066','#8ef07a','#6fd0ff'][i%3],r:rnd(2.5,5)});
      spawnCoinFx(); checkLevel(); save();
    }
  }
  return did;
}

/* ------------------------------------------------------------ the party
   Bought once, thrown whenever. Work stops, the whole valley walks into the
   wheat field and dances, and you join in with the button.                 */
const PARTY_BPM = 112;
const partyOn   = ()=> !!G.party;
const partyBeat = ()=> G.party ? G.party.t * (PARTY_BPM/60) : 0;

function partyCrowd(){ return actors.slice(1).concat(customers); }

function startParty(){
  const f = PATCHES[0].rect;
  const cx = f.x + f.w/2, cy = f.y + f.h/2;
  G.party = { t:0, lastBeat:-1, x:cx, y:cy };
  const crowd = partyCrowd(), n = Math.max(10, crowd.length);
  crowd.forEach((q,k)=>{
    const an = (k/n)*6.283, r = 2.4 + (k%3)*1.6;
    q.partyX = cx + Math.cos(an)*r;
    q.partyY = cy + Math.sin(an)*r*0.85;
    q.state = 'party'; q.dancing = false; q.vx = q.vy = 0;
  });
  const a = player();
  a.x = cx; a.y = cy + 3.2; a.vx = a.vy = 0;
  el('party').classList.add('on');
  el('chapter').classList.remove('on'); chapterT = 0;
  el('hint').classList.remove('on'); hintTimer = 0;
}

function endParty(){
  G.party = null;
  el('party').classList.remove('on');
  for(const q of actors.slice(1)){ q.state='seek'; q.target=null; q.tray=null; q.dancing=false; }
  for(const c of customers){ c.dancing=false; resetCustomer(c); }
  save();
}

function partyMove(q, dt){
  if(q.partyX === undefined) return;
  const dx = q.partyX - q.x, dy = q.partyY - q.y, m = Math.hypot(dx,dy);
  if(m > 0.2){
    const sp = 5.2;
    q.x += dx/m*sp*dt; q.y += dy/m*sp*dt;
    q.bob += dt*sp*3.4; q.moving = true; q.face = Math.atan2(dy,dx);
    q.dancing = false;
  } else {
    q.moving = false; q.vx = q.vy = 0; q.dancing = true;
  }
}

const TUNE = [0,4,7,4, 9,7,4,2, 0,4,7,12, 9,7,4,0];
function partyMusic(){
  const b = Math.floor(partyBeat());
  if(b === G.party.lastBeat) return;
  G.party.lastBeat = b;
  const root = 294;                                  // D
  beep(root * Math.pow(2, TUNE[b % TUNE.length]/12), 0.16, 'square', 0.045);
  if(b % 2 === 0) beep(root/2, 0.2, 'triangle', 0.05);
  if(b % 4 === 2) beep(1500, 0.04, 'square', 0.022);
}

function playerDance(){
  const a = player();
  a.danceMove = a.danceMove ? 0 : 1;                  // two moves, alternating
  a.danceT = 0.5;
  a.dancing = true;
  beep(700 + a.danceMove*180, 0.07, 'triangle', 0.04);
}

/* Lifetime earnings for a level. The square is what makes each level cost
   more than the last, and the tail term makes the gap itself grow, so the
   late ranks are a season's work rather than an afternoon's. */
function levelReq(n){ return Math.round(85*Math.pow(n,2)*(1 + n/400)); }
function checkLevel(){
  while(G.earned >= levelReq(G.level)){
    G.level++; sfx.levelup(); shake=Math.max(shake,7);
    pops.push({x:player().x, y:player().y, z:2.4, t:0, txt:'LEVEL '+G.level+'!', col:'#6fd0ff', big:true});
    const r = RANKS.find(x => x.lv === G.level);
    if(r) showBanner(r.name, r.line, 'LEVEL '+G.level);
    if(G.level>=15 && !G.won){ G.won=true; winModal(); }
    save();
  }
}

/* ------------------------------------------------------------ main update */
function update(dt){
  G.t += dt;
  const party = partyOn();
  if(party){ G.party.t += dt; partyMusic(); }
  const a = player();
  const d = inputDir();
  moveActor(a, d.x, d.y, d.m, dt);
  if(party){
    if(a.danceT > 0){ a.danceT -= dt; if(a.danceT <= 0) a.dancing = false; }
    for(const q of partyCrowd()) partyMove(q, dt);
  } else {
  tryHarvest(a, dt);
  tryStations(a, dt);
  for(let i=1;i<actors.length;i++) updateHand(actors[i], dt);

  produce(dt);
  updatePads(dt);
  }

  for(const p of PATCHES){
    if(!patchOpen(p)) continue;
    for(const t of p.nodes){
      if(!t.ripe){ t.t -= dt; if(t.t<=0){ t.ripe=true; t.grow=0; } }
      else if(t.grow<1) t.grow = Math.min(1, t.grow + dt*2.4);
    }
  }

  for(let i=flyers.length-1;i>=0;i--){
    const f=flyers[i]; f.t += dt/f.dur;
    if(f.t>=1){ if(f.onDone) f.onDone(); flyers.splice(i,1); }
  }
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.t+=dt; if(p.t>1.1) pops.splice(i,1); }
  for(let i=puffs.length-1;i>=0;i--){
    const p=puffs[i]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vz-=9*dt;
    if(p.t>p.life) puffs.splice(i,1);
  }
  for(let i=coinFx.length-1;i>=0;i--){ const c=coinFx[i]; c.t+=dt/c.dur; if(c.t>=1){ bumpPill('p-coin'); coinFx.splice(i,1);} }

  if(!party){
    updateCustomers(dt);
    keeperServe(dt);
    checkStory();
    if(G.orders.length < 2 || G.t - (G.orderT||0) > 6){ G.orderT = G.t; refreshOrders(); }
  }

  shake = Math.max(0, shake - dt*26);
  bannerT = Math.max(0, bannerT - dt);
  if(bannerT===0) el('banner').classList.remove('on');
  chapterT = Math.max(0, chapterT - dt);
  if(chapterT===0) el('chapter').classList.remove('on');
  hintTimer = Math.max(0, hintTimer - dt);
  if(hintTimer===0) document.getElementById('hint').classList.remove('on');

  // camera
  const ip = iso(a.x, a.y);
  cam.x = lerp(cam.x, ip.sx, 1-Math.pow(0.0015, dt));
  cam.y = lerp(cam.y, ip.sy, 1-Math.pow(0.0015, dt));

  syncHUD();
  if((G.t|0)!==lastSave && (G.t|0)%5===0){ lastSave=G.t|0; save(); }
}
