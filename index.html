function resize(){
  CW = innerWidth; CH = innerHeight;
  DPR = Math.min(devicePixelRatio||1, 2);
  cvs.width = CW*DPR; cvs.height = CH*DPR;
  ZOOM = clamp(Math.min(CW/760, CH/1150)*1.32, 0.42, 1.15);
}
addEventListener('resize', resize);

function worldToScreen(x,y,z){
  const p = iso(x,y);
  return { x:(p.sx-cam.x)*ZOOM + CW/2, y:(p.sy - (z||0)*TH*0.9 - cam.y)*ZOOM + CH/2 };
}

function quad(x,y,w,h,fill,alpha){
  const a=iso(x,y), b=iso(x+w,y), c=iso(x+w,y+h), d=iso(x,y+h);
  ctx.globalAlpha = alpha===undefined?1:alpha;
  ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.lineTo(c.sx,c.sy); ctx.lineTo(d.sx,d.sy); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(pts, fill, stroke, lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.lineJoin='round'; ctx.stroke(); }
}

/* deterministic scenery */
let decor = [];
function buildDecor(){
  decor = [];
  let seed = 1337;
  const rr = ()=> (seed = (seed*1664525+1013904223)%4294967296) / 4294967296;
  const blocked = (x,y)=>{
    for(const p of PATCHES){ const r=p.rect;
      if(x>r.x-1.5 && x<r.x+r.w+1.5 && y>r.y-1.5 && y<r.y+r.h+1.5) return true; }
    if(x>9.8 && x<18.4) return true;                        // the yard + pad lane
    for(const s of STATIONS){ const b=s.b; if(x>b.x-2&&x<b.x+b.w+2&&y>b.y-2&&y<b.y+b.h+2) return true; }
    if(x>32.4) return true;                                 // village road
    return false;
  };
  for(let i=0;i<900;i++){
    const x = rr()*MAP.w, y = rr()*MAP.h;
    if(blocked(x,y)) continue;
    const k = rr();
    decor.push({ x, y, kind: k<0.46?'tree' : k<0.72?'bale' : k<0.86?'bush' : 'rock',
                 s: 0.8+rr()*0.5, ph: rr()*6.28 });
  }
}

function drawGround(){
  quad(0,0,MAP.w,MAP.h, '#6ab043');
  for(let j=0;j<MAP.h;j+=2) quad(0,j,MAP.w,1, '#72b748');
  quad(10.4, 1.4, 8.2, MAP.h-3, '#cba46a');                 // yard + upgrade lane
  quad(10.4, 1.4, 8.2, MAP.h-3, '#000', 0.05);
  for(const p of PATCHES){
    if(!patchOpen(p)) continue;
    const r = p.rect, soil = p.kind==='tree' ? '#7fae4a' : '#a9793f';
    quad(r.x-1, r.y-1, r.w+2, r.h+2, soil);
    quad(r.x-1, r.y-1, r.w+2, r.h+2, '#000', 0.06);
  }
  quad(33.0, 2.5, 3.6, MAP.h-4, '#d8c48d');                 // village road
  for(const s of STATIONS){ if(!s.unlocked) continue; quad(s.b.x-0.7,s.b.y-0.7,s.b.w+1.4,s.b.h+1.4,'#b99257'); }
}

let view = {x0:-1e9,x1:1e9,y0:-1e9,y1:1e9};
function visible(p, m){ m=m||90; return p.sx>view.x0-m && p.sx<view.x1+m && p.sy>view.y0-m && p.sy<view.y1+m; }

const STALK = [[-12,3],[-5,7],[2,2],[9,6],[-1,-2]];
const _vis = [];
function drawFarmCosmetics(){
  if(G.wear['f-beds'] === 'beds'){
    for(let i=0;i<26;i++){
      const y = 4 + i*2, x = (i%2) ? 10.9 : 18.3;
      const q = iso(x, y);
      if(!visible(q, 60)) continue;
      for(let k=0;k<3;k++){
        const fx = q.sx + (k-1)*9, fy = q.sy - (k%2)*4;
        ctx.fillStyle='#3f8f36';
        ctx.beginPath(); ctx.ellipse(fx, fy+3, 7, 3.5, 0,0,6.29); ctx.fill();
        ctx.fillStyle=['#ef6a9a','#f4d03f','#9b7ede','#ff8b5e'][(i+k)%4];
        ctx.beginPath(); ctx.arc(fx, fy - 4 + Math.sin(G.t*1.5+i+k)*1.2, 3.4, 0, 6.29); ctx.fill();
        ctx.fillStyle='#fff8dc'; ctx.beginPath(); ctx.arc(fx, fy-4, 1.3, 0, 6.29); ctx.fill();
      }
    }
  }
  if(G.wear['f-bunting'] === 'bunting'){
    const COLS = ['#e8544a','#f4d03f','#4fae4a','#5b8ec4','#c2447a'];
    for(const y of [6, 16, 26, 36, 46]){
      const a = iso(10.6, y), b = iso(18.2, y);
      if(!visible(a, 160) && !visible(b, 160)) continue;
      const hang = 16, top = 62;
      ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(a.sx, a.sy-top); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.sx, b.sy-top); ctx.stroke();
      ctx.strokeStyle='#6b4a28'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy-top);
      ctx.quadraticCurveTo((a.sx+b.sx)/2, (a.sy+b.sy)/2-top+hang*2, b.sx, b.sy-top);
      ctx.stroke();
      for(let i=1;i<10;i++){
        const t = i/10, mt = 1-t;
        const fx = mt*mt*a.sx + 2*mt*t*((a.sx+b.sx)/2) + t*t*b.sx;
        const fy = mt*mt*(a.sy-top) + 2*mt*t*((a.sy+b.sy)/2-top+hang*2) + t*t*(b.sy-top);
        const w2 = Math.sin(G.t*2 + i)*1.5;
        poly([[fx-5,fy],[fx+5,fy],[fx+w2,fy+13]], COLS[i%COLS.length]);
      }
    }
  }
}

function drawCrops(){
  for(const p of PATCHES){
    if(!patchOpen(p) || p.kind!=='crop') continue;
    _vis.length = 0;
    for(const t of p.nodes){
      const q = iso(t.x, t.y);
      if(visible(q)) _vis.push([t, q.sx, q.sy]);
    }
    ctx.lineCap='round';
    ctx.strokeStyle='#c9991c'; ctx.lineWidth=2;
    ctx.beginPath();
    for(const v of _vis){
      const t=v[0]; if(!t.ripe) continue;
      for(let k=0;k<5;k++){
        const ox=STALK[k][0], oy=STALK[k][1];
        const sway = Math.sin(G.t*1.6 + t.seed + k*0.5)*2.8;
        const h = (19 + (k*7)%6) * t.grow;
        ctx.moveTo(v[1]+ox, v[2]+oy);
        ctx.quadraticCurveTo(v[1]+ox+sway*.4, v[2]+oy-h*.6, v[1]+ox+sway, v[2]+oy-h);
      }
    }
    ctx.stroke();
    ctx.fillStyle='#f2cc3f';
    ctx.beginPath();
    for(const v of _vis){
      const t=v[0]; if(!t.ripe) continue;
      for(let k=0;k<5;k++){
        const ox=STALK[k][0], oy=STALK[k][1];
        const sway = Math.sin(G.t*1.6 + t.seed + k*0.5)*2.8;
        const h = (19 + (k*7)%6) * t.grow;
        for(let i=0;i<3;i++){
          const cx = v[1]+ox+sway*(1-i*0.18), cy = v[2]+oy-h+i*3.6+1;
          const rx = 2.6*t.grow, ry = 4.0*t.grow;
          ctx.moveTo(cx+rx, cy);
          ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.29);
        }
      }
    }
    ctx.fill();
    ctx.strokeStyle='#96742f'; ctx.lineWidth=2.4;
    ctx.beginPath();
    for(const v of _vis){
      if(v[0].ripe) continue;
      for(let k=0;k<3;k++){
        const ox=STALK[k][0], oy=STALK[k][1];
        ctx.moveTo(v[1]+ox, v[2]+oy); ctx.lineTo(v[1]+ox, v[2]+oy-5);
      }
      ctx.moveTo(v[1]+2, v[2]+4); ctx.lineTo(v[1]+11, v[2]+2);
    }
    ctx.stroke();
  }
}

/* An apple tree. Fades out when the player would be hidden behind it. */
function drawTree(t, patch){
  const FRUIT = (patch && patch.fruit) || '#d8402f';
  const LEAF  = (patch && patch.leaf)  || '#2f7a34';
  const q = iso(t.x, t.y);
  if(!visible(q, 150)) return;
  const a = player();
  const behind = (t.x+t.y) > (a.x+a.y) &&
                 Math.abs(iso(a.x,a.y).sx - q.sx) < 46 &&
                 Math.abs(iso(a.x,a.y).sy - q.sy) < 78;
  ctx.globalAlpha = behind ? 0.45 : 1;
  const sway = Math.sin(G.t*0.9 + t.seed)*2.5;
  ctx.fillStyle='#000'; ctx.globalAlpha *= 1;
  const ga = ctx.globalAlpha;
  ctx.globalAlpha = ga*0.22;
  ctx.beginPath(); ctx.ellipse(q.sx, q.sy, 24, 12, 0,0,6.29); ctx.fill();
  ctx.globalAlpha = ga;
  ctx.fillStyle='#7a4a22'; ctx.fillRect(q.sx-6, q.sy-34, 12, 34);
  ctx.fillStyle=LEAF;
  ctx.beginPath(); ctx.ellipse(q.sx+sway, q.sy-58, 32, 27, 0,0,6.29); ctx.fill();
  ctx.fillStyle=shade(LEAF, 14);
  ctx.beginPath(); ctx.ellipse(q.sx-11+sway, q.sy-68, 21, 18, 0,0,6.29); ctx.fill();
  ctx.fillStyle=shade(LEAF, 30);
  ctx.beginPath(); ctx.ellipse(q.sx+12+sway, q.sy-72, 16, 14, 0,0,6.29); ctx.fill();
  if(t.ripe){
    ctx.fillStyle=FRUIT;
    const spots=[[-18,-50],[-4,-62],[13,-54],[3,-42],[22,-64],[-14,-70]];
    for(let i=0;i<spots.length;i++){
      const r = 5*t.grow;
      ctx.beginPath(); ctx.arc(q.sx+spots[i][0]+sway*0.6, q.sy+spots[i][1], r, 0, 6.29); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function fenceLine(x0,y0,x1,y1){
  const n = Math.max(2, Math.round(Math.hypot(x1-x0,y1-y0)*0.8));
  for(let i=0;i<=n;i++){
    const p = iso(lerp(x0,x1,i/n), lerp(y0,y1,i/n));
    ctx.fillStyle='#8a5a2b';
    ctx.fillRect(p.sx-2.5, p.sy-24, 5, 26);
    ctx.fillStyle='#a9703a';
    ctx.fillRect(p.sx-2.5, p.sy-24, 5, 4);
  }
  const a=iso(x0,y0), b=iso(x1,y1);
  ctx.strokeStyle='#a9703a'; ctx.lineWidth=4; ctx.lineCap='round';
  for(const dy of [-19,-9]){ ctx.beginPath(); ctx.moveTo(a.sx,a.sy+dy); ctx.lineTo(b.sx,b.sy+dy); ctx.stroke(); }
}

function drawDecorItem(d){
  const p = iso(d.x, d.y), s = d.s;
  if(!visible(p,120)) return;
  ctx.globalAlpha=.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 16*s, 8*s, 0,0,6.29); ctx.fill(); ctx.globalAlpha=1;
  if(d.kind==='tree'){
    const sway = Math.sin(G.t*0.9 + d.ph)*3;
    ctx.fillStyle='#7a4a22'; ctx.fillRect(p.sx-5*s, p.sy-30*s, 10*s, 30*s);
    ctx.fillStyle='#3f8f36';
    ctx.beginPath(); ctx.ellipse(p.sx+sway, p.sy-52*s, 30*s, 26*s, 0,0,6.29); ctx.fill();
    ctx.fillStyle='#4fae43';
    ctx.beginPath(); ctx.ellipse(p.sx-9*s+sway, p.sy-60*s, 20*s, 17*s, 0,0,6.29); ctx.fill();
    ctx.fillStyle='#63c455';
    ctx.beginPath(); ctx.ellipse(p.sx+10*s+sway, p.sy-64*s, 14*s, 12*s, 0,0,6.29); ctx.fill();
  } else if(d.kind==='bale'){
    ctx.fillStyle='#e0a83c'; roundRect(p.sx-18*s, p.sy-26*s, 36*s, 26*s, 8*s); ctx.fill();
    ctx.fillStyle='#c98f26'; roundRect(p.sx-18*s, p.sy-10*s, 36*s, 10*s, 5*s); ctx.fill();
    ctx.strokeStyle='#a8750f'; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.moveTo(p.sx-6*s,p.sy-26*s); ctx.lineTo(p.sx-6*s,p.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.sx+6*s,p.sy-26*s); ctx.lineTo(p.sx+6*s,p.sy); ctx.stroke();
  } else if(d.kind==='bush'){
    ctx.fillStyle='#478f3a';
    ctx.beginPath(); ctx.ellipse(p.sx, p.sy-10*s, 18*s, 13*s,0,0,6.29); ctx.fill();
    ctx.fillStyle='#58a846';
    ctx.beginPath(); ctx.ellipse(p.sx-5*s, p.sy-16*s, 12*s, 9*s,0,0,6.29); ctx.fill();
  } else {
    ctx.fillStyle='#9aa0a6';
    poly([[p.sx-14*s,p.sy],[p.sx-7*s,p.sy-14*s],[p.sx+6*s,p.sy-16*s],[p.sx+14*s,p.sy]], '#9aa0a6');
    poly([[p.sx-7*s,p.sy-14*s],[p.sx+6*s,p.sy-16*s],[p.sx+14*s,p.sy],[p.sx+2*s,p.sy-4*s]], '#b6bcc2');
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---- putting things on a wall -------------------------------------------
   A face is two ground corners plus the wall height. (u,v) runs along the
   wall and up it, so a door or window is a parallelogram in screen space
   and sits flat on the building instead of floating in front of it.      */
const facePt = (P0,P1,H,u,v)=>[ lerp(P0.sx,P1.sx,u), lerp(P0.sy,P1.sy,u) - v*H ];
function faceQuad(P0,P1,H,u0,u1,v0,v1){
  return [ facePt(P0,P1,H,u0,v0), facePt(P0,P1,H,u1,v0),
           facePt(P0,P1,H,u1,v1), facePt(P0,P1,H,u0,v1) ];
}
function drawDoor(P0,P1,H,u,hw,hv,col){
  col = col || '#8a5a2b';
  poly(faceQuad(P0,P1,H,u-hw,u+hw,0,hv), col, '#00000033', 2);
  poly(faceQuad(P0,P1,H,u-hw*0.74,u+hw*0.74,0.02,hv*0.9), shade(col,-26));
  const k = facePt(P0,P1,H,u+hw*0.45,hv*0.45);
  ctx.fillStyle='#f2d791'; ctx.beginPath(); ctx.arc(k[0],k[1],2.8,0,6.29); ctx.fill();
}
function drawWindow(P0,P1,H,u,v,hw,hv){
  poly(faceQuad(P0,P1,H,u-hw,u+hw,v-hv,v+hv), '#fdf7e6', '#00000022', 2);
  poly(faceQuad(P0,P1,H,u-hw*0.74,u+hw*0.74,v-hv*0.72,v+hv*0.72), '#8ec6e6');
  poly(faceQuad(P0,P1,H,u-hw*0.7,u-hw*0.05,v-hv*0.66,v+hv*0.64), 'rgba(255,255,255,.4)');
  ctx.strokeStyle='#efe3c6'; ctx.lineWidth=2;
  let a=facePt(P0,P1,H,u,v-hv*0.72), c=facePt(P0,P1,H,u,v+hv*0.72);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(c[0],c[1]); ctx.stroke();
  a=facePt(P0,P1,H,u-hw*0.74,v); c=facePt(P0,P1,H,u+hw*0.74,v);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(c[0],c[1]); ctx.stroke();
}

function drawBuilding(s){
  const b = s.b;
  const shape = s.shape || 'house';
  const H  = shape==='mill' ? 84 : shape==='shed' ? 60 : 74;
  const RH = shape==='mill' ? 44 : shape==='shed' ? 34 : 40;
  const OV = 0.25;                                   // roof overhang, in tiles
  const wallS = '#f3e6cb', wallE = '#dbcaa9';

  const N=iso(b.x,b.y), E=iso(b.x+b.w,b.y), S=iso(b.x+b.w,b.y+b.h), W=iso(b.x,b.y+b.h);
  const rN=iso(b.x-OV,b.y-OV), rE=iso(b.x+b.w+OV,b.y-OV),
        rS=iso(b.x+b.w+OV,b.y+b.h+OV), rW=iso(b.x-OV,b.y+b.h+OV);
  const up=(p,h)=>[p.sx, p.sy-h];
  const mid = iso(b.x+b.w/2, b.y+b.h/2);

  ctx.globalAlpha=.25;
  poly([[N.sx,N.sy+6],[E.sx+8,E.sy+6],[S.sx,S.sy+8],[W.sx-8,W.sy+6]],'#000');
  ctx.globalAlpha=1;

  // ---- walls (only the two the camera can see)
  poly([up(W,0),up(S,0),up(S,H),up(W,H)], wallS);
  poly([up(E,0),up(S,0),up(S,H),up(E,H)], wallE);
  if(shape==='mill'){                                // stone footing
    poly(faceQuad(W,S,H,0,1,0,0.13), '#c3b8a2');
    poly(faceQuad(E,S,H,0,1,0,0.13), '#ada291');
  }

  /* Roof and gable. The eaves overhang, but the GABLE ENDS must not: a roof
     that oversails the end wall straddles the gable plane, and whichever way
     it is ordered it buries the triangle. Ends flush, then the triangle is
     drawn over the roof, then a barge board along the edge.               */
  const along = b.w >= b.h;
  let R1, R2, f1, f2, gTri;
  if(along){
    const eN=iso(b.x,b.y-OV), eE=iso(b.x+b.w,b.y-OV),
          eS=iso(b.x+b.w,b.y+b.h+OV), eW=iso(b.x,b.y+b.h+OV);
    const gw=iso(b.x,b.y+b.h/2), ge=iso(b.x+b.w,b.y+b.h/2);
    R1=[gw.sx, gw.sy-H-RH]; R2=[ge.sx, ge.sy-H-RH];
    f1=[up(eN,H),up(eE,H),R2,R1]; f2=[up(eW,H),up(eS,H),R2,R1];
    gTri=[up(E,H), up(S,H), R2];
  } else {
    const eN=iso(b.x-OV,b.y), eE=iso(b.x+b.w+OV,b.y),
          eS=iso(b.x+b.w+OV,b.y+b.h), eW=iso(b.x-OV,b.y+b.h);
    const gn=iso(b.x+b.w/2,b.y), gs=iso(b.x+b.w/2,b.y+b.h);
    R1=[gn.sx, gn.sy-H-RH]; R2=[gs.sx, gs.sy-H-RH];
    f1=[up(eN,H),up(eW,H),R2,R1]; f2=[up(eE,H),up(eS,H),R2,R1];
    gTri=[up(W,H), up(S,H), R2];
  }

  // ---- doors and windows, flat on the walls
  if(shape === 'shed'){                              // coop: mostly door
    drawDoor(E,S,H, 0.52, Math.min(0.32, 1.5/b.h), 0.76, '#7c4f26');
    const hatch = facePt(W,S,H, 0.5, 0.82);          // pop-hole for the hens
    ctx.fillStyle='#8fb7d8'; ctx.beginPath(); ctx.arc(hatch[0],hatch[1],7,0,6.29); ctx.fill();
    ctx.strokeStyle='#fdf7e6'; ctx.lineWidth=2.5; ctx.stroke();
  } else if(shape === 'mill'){
    drawDoor(E,S,H, 0.5, 0.6/b.h, 0.46, '#7c4f26');
    drawWindow(W,S,H, 0.28, 0.62, 0.36/b.w, 0.085);
    drawWindow(W,S,H, 0.72, 0.62, 0.36/b.w, 0.085);
    drawWindow(W,S,H, 0.5,  0.30, 0.36/b.w, 0.085);
  } else {
    drawDoor(E,S,H, 0.5, 0.55/b.h, 0.62);
    if(b.h >= 5){
      drawWindow(E,S,H, 0.17, 0.62, 0.4/b.h, 0.115);
      drawWindow(E,S,H, 0.83, 0.62, 0.4/b.h, 0.115);
    }
    drawWindow(W,S,H, 0.24, 0.62, 0.42/b.w, 0.115);
    drawWindow(W,S,H, 0.5,  0.62, 0.42/b.w, 0.115);
    drawWindow(W,S,H, 0.76, 0.62, 0.42/b.w, 0.115);
  }

  // ---- roof last, so the eaves overhang everything below
  poly(f1, shade(s.roof,-30), '#00000022', 2);
  poly(f2, s.roof, '#00000022', 2);
  ctx.strokeStyle = shade(s.roof,-46); ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(R1[0],R1[1]); ctx.lineTo(R2[0],R2[1]); ctx.stroke();
  poly(gTri, shade(wallE, 12), '#00000018', 2);                 // the gable itself
  ctx.strokeStyle = shade(s.roof,-14); ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(gTri[0][0],gTri[0][1]); ctx.lineTo(gTri[2][0],gTri[2][1]);
  ctx.lineTo(gTri[1][0],gTri[1][1]); ctx.stroke();              // barge boards

  const topY = mid.sy - H - RH;
  if(s.motif==='sails'){
    // mounted on the gable end, just under the roof apex
    let gApex, gBase;
    if(along){
      const ge = iso(b.x+b.w, b.y+b.h/2);
      gApex = [ge.sx, ge.sy-H-RH];
      gBase = [(E.sx+S.sx)/2, (E.sy+S.sy)/2 - H];
    } else {
      const gs = iso(b.x+b.w/2, b.y+b.h);
      gApex = [gs.sx, gs.sy-H-RH];
      gBase = [(W.sx+S.sx)/2, (W.sy+S.sy)/2 - H];
    }
    const cx = lerp(gBase[0], gApex[0], 0.66), cy = lerp(gBase[1], gApex[1], 0.66);
    const ang = G.t*0.85;
    for(let i=0;i<4;i++){
      const a1 = ang + i*Math.PI/2;
      const ex = cx + Math.cos(a1)*54, ey = cy + Math.sin(a1)*54;
      ctx.strokeStyle='#6b4a28'; ctx.lineWidth=7; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(a1);
      ctx.fillStyle='#fdf6e6'; ctx.strokeStyle='#b9a37c'; ctx.lineWidth=2.5;
      roundRect(-28, -11, 28, 22, 4); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#d9cbaa'; ctx.lineWidth=2;
      for(let k=1;k<4;k++){ ctx.beginPath(); ctx.moveTo(-28+k*7, -11); ctx.lineTo(-28+k*7, 11); ctx.stroke(); }
      ctx.restore();
    }
    ctx.fillStyle='#4a3418'; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 6.29); ctx.fill();
    ctx.fillStyle='#8a6a3c'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 6.29); ctx.fill();
  } else if(s.motif==='silo'){
    const q = iso(b.x+b.w+0.45, b.y+b.h*0.62);        // stands on the ground beside the barn
    const sh = H + 52, sw = 30;
    ctx.globalAlpha=.22; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(q.sx, q.sy, sw*0.62, sw*0.3, 0,0,6.29); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='#cfd6da'; roundRect(q.sx-sw/2, q.sy-sh, sw, sh, 5); ctx.fill();
    ctx.fillStyle='#b9c3c9'; roundRect(q.sx+2, q.sy-sh, sw/2-2, sh, 5); ctx.fill();
    ctx.strokeStyle='#aab6bd'; ctx.lineWidth=2;
    for(let i=1;i<5;i++){ const yy=q.sy-sh*i/5;
      ctx.beginPath(); ctx.moveTo(q.sx-sw/2+1, yy); ctx.lineTo(q.sx+sw/2-1, yy); ctx.stroke(); }
    ctx.fillStyle='#8d9aa2';
    ctx.beginPath(); ctx.ellipse(q.sx, q.sy-sh, sw/2, 11, 0, Math.PI, 0); ctx.fill();
  } else if(s.motif==='chimney'){
    const q = iso(b.x+b.w*0.3, b.y+b.h*0.3);
    ctx.fillStyle='#8d5a3c'; ctx.fillRect(q.sx-8, topY-26, 17, 40);
    ctx.fillStyle='#a86c49'; ctx.fillRect(q.sx-8, topY-26, 17, 6);
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<3;i++){
      const t = (G.t*0.5 + i/3) % 1;
      ctx.globalAlpha = (1-t)*0.55;
      ctx.beginPath(); ctx.arc(q.sx, topY-32-t*46, 5+t*9, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if(s.motif==='perch'){
    const q = iso(b.x+b.w*0.5, b.y+b.h*0.5);
    ctx.strokeStyle='#6b4a28'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(q.sx, topY+2); ctx.lineTo(q.sx, topY-20); ctx.stroke();
    ctx.fillStyle='#d9483f';
    poly([[q.sx-2,topY-30],[q.sx+18,topY-24],[q.sx-2,topY-18]], '#d9483f');
    ctx.fillStyle='#4a3418'; ctx.beginPath(); ctx.arc(q.sx-2, topY-24, 5, 0, 6.29); ctx.fill();
  } else if(s.motif==='vent'){
    const q = iso(b.x+b.w*0.5, b.y+b.h*0.5);
    ctx.fillStyle='#8d9aa2'; roundRect(q.sx-13, topY-18, 26, 16, 5); ctx.fill();
    ctx.fillStyle='#5d6a72'; roundRect(q.sx-9, topY-13, 18, 6, 3); ctx.fill();
  } else if(s.motif==='flag'){
    const q = iso(b.x+b.w*0.5, b.y+b.h*0.5);
    ctx.strokeStyle='#6b4a28'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(q.sx, topY+2); ctx.lineTo(q.sx, topY-34); ctx.stroke();
    const w = Math.sin(G.t*3)*3;
    ctx.fillStyle='#f4d03f';
    poly([[q.sx,topY-34],[q.sx+26,topY-28+w],[q.sx,topY-20]], '#f4d03f');
  }
  signBoard(mid.sx, mid.sy-H-RH-26, s.name);
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return 'rgb('+r+','+g+','+b+')';
}

function signBoard(sx, sy, text){
  ctx.font = '900 19px system-ui, sans-serif';
  const w = ctx.measureText(text).width + 26;
  ctx.fillStyle='#000'; ctx.globalAlpha=.2; roundRect(sx-w/2+3, sy-15, w, 32, 10); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle='#fff8e6'; roundRect(sx-w/2, sy-18, w, 32, 10); ctx.fill();
  ctx.strokeStyle='#c9a96a'; ctx.lineWidth=3; roundRect(sx-w/2, sy-18, w, 32, 10); ctx.stroke();
  ctx.fillStyle='#7a4f1d'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, sx, sy);
}

/* ------------------------------------------------------------ items */
function drawItem(kind, x, y, s){
  s = s||1;
  if(kind==='wheat'){
    ctx.strokeStyle='#d9a41c'; ctx.lineWidth=2.4*s; ctx.lineCap='round';
    for(let k=-1;k<=1;k++){
      ctx.beginPath(); ctx.moveTo(x, y+7*s); ctx.lineTo(x+k*5*s, y-9*s); ctx.stroke();
      ctx.fillStyle='#f7d54a';
      ctx.beginPath(); ctx.ellipse(x+k*5*s, y-10*s, 3.4*s, 5.4*s, k*0.3, 0, 6.29); ctx.fill();
    }
    ctx.strokeStyle='#b5771a'; ctx.lineWidth=2.6*s;
    ctx.beginPath(); ctx.moveTo(x-5*s,y+2*s); ctx.lineTo(x+5*s,y+2*s); ctx.stroke();
  } else if(kind==='egg'){
    ctx.fillStyle='#fffdf4';
    ctx.beginPath(); ctx.ellipse(x, y, 6*s, 7.6*s, 0,0,6.29); ctx.fill();
    ctx.fillStyle='#e3dcc6';
    ctx.beginPath(); ctx.ellipse(x+2*s, y+1.5*s, 3*s, 4*s, 0,0,6.29); ctx.fill();
  } else if(kind==='apple'){
    ctx.fillStyle='#d8402f';
    ctx.beginPath(); ctx.arc(x, y, 7*s, 0, 6.29); ctx.fill();
    ctx.fillStyle='#ef6a55';
    ctx.beginPath(); ctx.arc(x-2.4*s, y-2.4*s, 2.6*s, 0, 6.29); ctx.fill();
    ctx.strokeStyle='#6b4a22'; ctx.lineWidth=1.6*s;
    ctx.beginPath(); ctx.moveTo(x, y-6*s); ctx.lineTo(x+1*s, y-9.5*s); ctx.stroke();
    ctx.fillStyle='#3d9440';
    ctx.beginPath(); ctx.ellipse(x+4*s, y-9*s, 3.4*s, 1.9*s, -0.5, 0, 6.29); ctx.fill();
  } else if(kind==='cherry'){
    ctx.strokeStyle='#4b7a2a'; ctx.lineWidth=1.7*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-3*s, y-8*s); ctx.quadraticCurveTo(x, y-11*s, x+3*s, y-8*s); ctx.stroke();
    for(const dx of [-4, 4]){
      ctx.strokeStyle='#4b7a2a'; ctx.lineWidth=1.5*s;
      ctx.beginPath(); ctx.moveTo(x+dx*0.5*s, y-8*s); ctx.lineTo(x+dx*s, y-1*s); ctx.stroke();
      ctx.fillStyle='#8e1533';
      ctx.beginPath(); ctx.arc(x+dx*s, y+3*s, 4.6*s, 0, 6.29); ctx.fill();
      ctx.fillStyle='#c0325a';
      ctx.beginPath(); ctx.arc(x+dx*s-1.4*s, y+1.6*s, 1.7*s, 0, 6.29); ctx.fill();
    }
  } else if(kind==='cherryjam'){
    ctx.fillStyle='#5d1030';
    roundRect(x-5.5*s, y-4*s, 11*s, 11*s, 2.5*s); ctx.fill();
    ctx.fillStyle='#8e1f4d';
    roundRect(x-5.5*s, y-4*s, 11*s, 4*s, 2*s); ctx.fill();
    ctx.fillStyle='#f0d98a';
    roundRect(x-6.5*s, y-7.5*s, 13*s, 4*s, 1.8*s); ctx.fill();
    ctx.fillStyle='#d8b84a';
    ctx.beginPath(); ctx.arc(x, y+2*s, 1.8*s, 0, 6.29); ctx.fill();
  } else if(kind==='cherrypie'){
    ctx.fillStyle='#b8305f';
    ctx.beginPath(); ctx.ellipse(x, y+2*s, 10*s, 6*s, 0,0,6.29); ctx.fill();
    ctx.fillStyle='#e9c078';
    ctx.beginPath(); ctx.ellipse(x, y-1*s, 9.5*s, 6*s, 0,0,6.29); ctx.fill();
    ctx.fillStyle='#8e1533';
    for(const d of [[-4,-2],[3,-3],[0,1],[5,0]]){
      ctx.beginPath(); ctx.arc(x+d[0]*s, y+d[1]*s, 1.9*s, 0, 6.29); ctx.fill();
    }
    ctx.strokeStyle='#d8a85c'; ctx.lineWidth=1.5*s;
    for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(x-8*s, y-3*s+k*3*s); ctx.lineTo(x+8*s, y-3*s+k*3*s); ctx.stroke(); }
  } else if(kind==='flour'){
    ctx.fillStyle='#efe4cb';
    roundRect(x-6.5*s, y-5*s, 13*s, 12*s, 3.5*s); ctx.fill();
    ctx.fillStyle='#dccfb0';
    roundRect(x-6.5*s, y+1*s, 13*s, 6*s, 3*s); ctx.fill();
    ctx.strokeStyle='#b9a888'; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.moveTo(x-4*s, y-5*s); ctx.lineTo(x+4*s, y-5*s); ctx.stroke();
    ctx.fillStyle='#c0a97e';
    ctx.beginPath(); ctx.ellipse(x, y-6.5*s, 4.5*s, 2.2*s, 0,0,6.29); ctx.fill();
  } else if(kind==='milk'){
    ctx.fillStyle='#e8eef2';
    roundRect(x-5*s, y-7*s, 10*s, 14*s, 2.5*s); ctx.fill();
    ctx.fillStyle='#cdd8de';
    roundRect(x-5*s, y+2*s, 10*s, 5*s, 2.5*s); ctx.fill();
    ctx.fillStyle='#9fb0ba';
    roundRect(x-3*s, y-9.5*s, 6*s, 3.5*s, 1.5*s); ctx.fill();
  } else if(kind==='cheese'){
    ctx.fillStyle='#f2c33c';
    poly([[x-9*s,y+5*s],[x+9*s,y+5*s],[x+9*s,y-2*s],[x-9*s,y+5*s]], '#f2c33c');
    ctx.fillStyle='#ffdf6b';
    poly([[x-9*s,y+5*s],[x+9*s,y-2*s],[x+9*s,y-5*s],[x-9*s,y+2*s]], '#ffdf6b');
    ctx.fillStyle='#d9a923';
    ctx.beginPath(); ctx.arc(x+3*s, y+2*s, 1.6*s, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(x-2*s, y+3.6*s, 1.2*s, 0, 6.29); ctx.fill();
  } else if(kind==='jam'){
    ctx.fillStyle='#c2761b';                       // apple jam: amber, not strawberry
    roundRect(x-5.5*s, y-4*s, 11*s, 11*s, 2.5*s); ctx.fill();
    ctx.fillStyle='#e09a35';
    roundRect(x-5.5*s, y-4*s, 11*s, 4*s, 2*s); ctx.fill();
    ctx.fillStyle='#e8d9b5';
    roundRect(x-6.5*s, y-7.5*s, 13*s, 4*s, 1.8*s); ctx.fill();
  } else {
    ctx.fillStyle='#c98244';
    ctx.beginPath(); ctx.ellipse(x, y+2*s, 10*s, 6*s, 0,0,6.29); ctx.fill();
    ctx.fillStyle='#eab473';
    ctx.beginPath(); ctx.ellipse(x, y-1*s, 9.5*s, 6*s, 0,0,6.29); ctx.fill();
    ctx.strokeStyle='#c98244'; ctx.lineWidth=1.6*s;
    for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(x-8*s+k*0, y-3*s+k*3*s); ctx.lineTo(x+8*s, y-3*s+k*3*s); ctx.stroke(); }
  }
}

/* The same picture in the HUD as in the world. Drawn once per good, big, and
   shown small, so it stays sharp on a phone. */
const ICONS = {};
function itemIcon(k){
  if(ICONS[k]) return ICONS[k];
  const R = 72, off = document.createElement('canvas');
  off.width = off.height = R;
  const real = ctx;
  ctx = off.getContext('2d');
  try { ctx.translate(R/2, R/2 + 4); drawItem(k, 0, 0, 2.5); }
  finally { ctx = real; }
  return ICONS[k] = off.toDataURL();
}
function iconTag(k, cls){
  return '<img src="'+itemIcon(k)+'" alt="'+ITEMS[k].label+'"'+(cls?' class="'+cls+'"':'')+'>';
}

/* ------------------------------------------------------------ trays */
function drawTray(s, tr){
  const col = tr.mode==='in' ? '#3f8ad8' : tr.mode==='out' ? '#3fb85e' : '#e0a400';
  const pulse = 0.5 + 0.5*Math.sin(G.t*3);
  quad(tr.x, tr.y, tr.w, tr.h, '#000', .18);
  quad(tr.x+.08, tr.y+.08, tr.w-.16, tr.h-.16, col, .55+0.18*pulse);
  const c = rectCenter(tr), p = iso(c.x, c.y);

  if(tr.mode==='sell'){
    ctx.font='900 26px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.strokeStyle='#8a5a00'; ctx.lineWidth=5;
    ctx.strokeText('SELL', p.sx, p.sy-6); ctx.fillText('SELL', p.sx, p.sy-6);
    const all = availableItems();
    const shown = all.slice(0, 4);                 // the counter is only so wide
    ctx.font='900 13px system-ui,sans-serif'; ctx.fillStyle='#fff'; ctx.lineWidth=4;
    shown.forEach((k,i)=>{
      const x = p.sx + (i-(shown.length-1)/2)*46;
      drawItem(k, x-11, p.sy+18, .8);
      ctx.strokeText('$'+ITEMS[k].price, x+11, p.sy+18);
      ctx.fillText('$'+ITEMS[k].price, x+11, p.sy+18);
    });
    return;
  }
  const n = tr.mode==='in' ? s.bin[tr.item] : outTotal(s);
  const pile = [];
  if(tr.mode==='in') for(let i=0;i<Math.min(n,18);i++) pile.push(tr.item);
  else for(const k of ITEM_ORDER){ for(let i=0;i<s.out[k] && pile.length<18;i++) pile.push(k); }
  pile.forEach((k,i)=>{
    const col2 = i%3, row = Math.floor(i/3);
    drawItem(k, p.sx + (col2-1)*15, p.sy + 4 - row*7 - (row%2)*2, 0.85);
  });
  ctx.font='900 17px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.strokeStyle='#00000066'; ctx.lineWidth=4;
  const lbl = (tr.mode==='in'?'FEED ':'TAKE ') + n;
  ctx.strokeText(lbl, p.sx, p.sy+24); ctx.fillText(lbl, p.sx, p.sy+24);
}

/* The takings, on their own square beside the counter. Drawn with the
   entities rather than with the trays, because the trays go down before the
   buildings and the market roof would swallow the pile. */
function drawTillPad(){
  if(G.till < 1) return;
  const pulse = 0.5 + 0.5*Math.sin(G.t*3);
  quad(TILL_PAD.x, TILL_PAD.y, TILL_PAD.w, TILL_PAD.h, '#000', .18);
  quad(TILL_PAD.x+.08, TILL_PAD.y+.08, TILL_PAD.w-.16, TILL_PAD.h-.16, '#2f9e4a', .42+0.18*pulse);
}
function drawTillPile(){
  if(G.till < 1) return;
  const c = rectCenter(TILL_PAD), p = iso(c.x, c.y);
  const bills = Math.min(18, 2 + Math.floor(Math.log10(1 + G.till) * 3));
  for(let i=0;i<bills;i++){
    const bx = p.sx - 15 + (i%3)*15, by = p.sy + 3 - Math.floor(i/3)*6 - (i%3)*2;
    ctx.fillStyle='#4caf50'; ctx.strokeStyle='#2e7d32'; ctx.lineWidth=1.5;
    roundRect(bx-9, by-5, 18, 10, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#a5e8a8'; ctx.beginPath(); ctx.arc(bx, by, 2.4, 0, 6.29); ctx.fill();
  }
  // both labels go below the pile: the counter's own price row runs straight
  // across the space above it
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#eaffe6'; ctx.strokeStyle='#1f5a22';
  ctx.font='900 12px system-ui,sans-serif'; ctx.lineWidth=3.5;
  ctx.strokeText('TAKINGS', p.sx, p.sy+22); ctx.fillText('TAKINGS', p.sx, p.sy+22);
  ctx.font='900 18px system-ui,sans-serif'; ctx.lineWidth=4.5;
  const tt = '$'+fmt(G.till);
  ctx.strokeText(tt, p.sx, p.sy+41); ctx.fillText(tt, p.sx, p.sy+41);
}

/* ------------------------------------------------------------ pads */
function drawPadGround(p){
  const lv = G.up[p.id]||0;
  if(lv>=p.max || !p.show()) return;
  const pulse = 0.5+0.5*Math.sin(G.t*4 + p.x);
  quad(p.x-1.05, p.y-1.05, 2.1, 2.1, '#000', .2);
  quad(p.x-1, p.y-1, 2, 2, p.active ? '#ffe680' : '#6fd0ff', p.active? .55+.25*pulse : .3+.12*pulse);
}

function drawPadPanel(p){
  const lv = G.up[p.id]||0;
  if(lv>=p.max || !p.show()) return;
  const cost = padCost(p), paid = G.paid[p.id], f = clamp(paid/cost,0,1);
  const s = iso(p.x, p.y);
  if(!visible(s,200)) return;
  const W = 120, H = 72, y0 = s.sy - 116;
  ctx.globalAlpha=.85;
  ctx.fillStyle='#2a1c0e'; roundRect(s.sx-W/2, y0, W, H, 14); ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle = p.active? '#ffe680':'#6fd0ff'; ctx.lineWidth=3;
  roundRect(s.sx-W/2, y0, W, H, 14); ctx.stroke();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='23px system-ui,sans-serif'; ctx.fillText(p.icon, s.sx, y0+19);
  ctx.font='900 13px system-ui,sans-serif'; ctx.fillStyle='#fff';
  ctx.fillText(p.name, s.sx, y0+36);
  ctx.font='700 10px system-ui,sans-serif'; ctx.fillStyle='#cdbfa8';
  ctx.fillText(p.desc(lv+1), s.sx, y0+49);

  // cost bar
  const bw=W-24, bx=s.sx-bw/2, by=y0+H-16;
  ctx.fillStyle='#000'; roundRect(bx,by,bw,13,7); ctx.fill();
  ctx.fillStyle='#ffd23d'; roundRect(bx,by,Math.max(6,bw*f),13,7); ctx.fill();
  ctx.font='900 12px system-ui,sans-serif'; ctx.fillStyle= f>0.5?'#4a3418':'#fff';
  ctx.fillText('$'+fmt(Math.ceil(cost-paid)), s.sx, by+6.5);
  // stem
  ctx.strokeStyle= p.active? '#ffe680':'#6fd0ff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(s.sx, y0+H); ctx.lineTo(s.sx, s.sy-10); ctx.stroke();
}

/* ------------------------------------------------------------ people */
function drawPerson(a, sx, sy, tint, opts){
  opts = opts||{};
  const bob = Math.sin(a.bob*2)*3, step = Math.sin(a.bob*4);
  const flip = Math.cos(a.face) - Math.sin(a.face) < 0 ? -1 : 1;  // screen-facing
  const napping = a.state === 'nap';
  ctx.globalAlpha=.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy, napping?21:15, napping?9:7.5, 0,0,6.29); ctx.fill(); ctx.globalAlpha=1;
  if(napping){ ctx.save(); ctx.translate(sx-9, sy+3); ctx.rotate(-1.28); ctx.translate(-sx, -sy); }

  const wear = (a.job === 'player' && G.wear) ? G.wear : {};

  /* dancing: a hop on every beat, arms up on one move and out on the other,
     so mashing the button in time lands you on the same two the crowd does */
  const dancing = partyOn() && a.dancing;
  let hop = 0, lean = 0, armsUp = false;
  if(dancing){
    const beat = partyBeat();
    const mv = (a.job === 'player') ? (a.danceMove || 0) : (Math.floor(beat) % 2);
    hop = Math.abs(Math.sin(beat * Math.PI)) * 7;
    armsUp = mv === 0;
    lean = armsUp ? 0 : Math.sin(beat * Math.PI * 2) * 0.17;
  }
  if(lean){ ctx.save(); ctx.translate(sx, sy); ctx.rotate(lean); ctx.translate(-sx, -sy); }

  // legs
  ctx.fillStyle = wear.boots === 'gboots' ? '#e5b83a' : '#3c5fa0';
  roundRect(sx-9, sy-16+ (a.moving? Math.max(0,step)*-3:0), 8, 18, 4); ctx.fill();
  roundRect(sx+1, sy-16+ (a.moving? Math.max(0,-step)*-3:0), 8, 18, 4); ctx.fill();
  // torso
  ctx.fillStyle=tint; roundRect(sx-12, sy-40+bob-hop, 24, 27, 9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)'; roundRect(sx-12, sy-40+bob-hop, 24, 9, 6); ctx.fill();
  // arms
  ctx.fillStyle=tint;
  if(dancing && armsUp){                        // both arms straight up
    for(const sgn of [-1, 1]){
      ctx.save(); ctx.translate(sx+sgn*11, sy-36+bob-hop); ctx.rotate(sgn*(Math.PI-0.28));
      roundRect(-3.4, 0, 6.8, 17, 3.4); ctx.fill(); ctx.restore();
    }
  } else if(dancing){                           // arms out to the sides
    for(const sgn of [-1, 1]){
      ctx.save(); ctx.translate(sx+sgn*11, sy-34+bob-hop); ctx.rotate(sgn*(Math.PI/2 + 0.2));
      roundRect(-3.4, 0, 6.8, 16, 3.4); ctx.fill(); ctx.restore();
    }
  } else {
    roundRect(sx-16, sy-38+bob+(a.moving?step*2:0), 7, 18, 3.5); ctx.fill();
    roundRect(sx+9,  sy-38+bob-(a.moving?step*2:0), 7, 18, 3.5); ctx.fill();
  }
  // head
  const hy = sy-50+bob-hop;
  ctx.fillStyle='#f4c79c'; ctx.beginPath(); ctx.arc(sx, hy, 11.5, 0, 6.29); ctx.fill();
  ctx.fillStyle=opts.hair||'#5b3a1c';
  ctx.beginPath(); ctx.arc(sx, hy-2, 11.5, Math.PI*1.03, Math.PI*2.05); ctx.fill();
  ctx.fillStyle='#3a2a1a';
  if(napping){
    ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=1.8; ctx.lineCap='round';
    for(const ex of [-3.4, 3.4]){
      ctx.beginPath(); ctx.arc(sx+flip*2+ex, hy+1.6, 2.4, 0.35, Math.PI-0.35); ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.arc(sx+flip*2-3.4, hy+2.5, 1.8, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+flip*2+3.4, hy+2.5, 1.8, 0, 6.29); ctx.fill();
  }
  ctx.strokeStyle='#b5745a'; ctx.lineWidth=1.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(sx+flip*2, hy+4.5, 3.2, 0.35, Math.PI-0.35); ctx.stroke();

  if(wear.neck === 'scarf'){
    ctx.fillStyle='#c9342f'; roundRect(sx-13, hy+9, 26, 7, 3.5); ctx.fill();
    ctx.fillStyle='#e0574f';
    const sway = Math.sin(G.t*4 + (a.moving?a.bob:0))*3;
    roundRect(sx+flip*8, hy+13, 7, 15+sway*0.4, 3); ctx.fill();
  }
  if(wear.hat === 'straw'){
    ctx.fillStyle='#e0b95c';
    ctx.beginPath(); ctx.ellipse(sx, hy-7, 20, 7, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle='#efd07d'; roundRect(sx-9, hy-17, 18, 11, 5); ctx.fill();
    ctx.fillStyle='#a8722c'; roundRect(sx-9, hy-9, 18, 4, 2); ctx.fill();
  } else if(wear.hat === 'crown'){
    for(let i=0;i<7;i++){
      const an = Math.PI + i*(Math.PI/6);
      const fx = sx + Math.cos(an)*11.5, fy = hy - 3 + Math.sin(an)*7;
      ctx.fillStyle=['#f4d03f','#ef8fb5','#fff','#9be07a'][i%4];
      ctx.beginPath(); ctx.arc(fx, fy, 3.6, 0, 6.29); ctx.fill();
      ctx.fillStyle='#e8a13a'; ctx.beginPath(); ctx.arc(fx, fy, 1.4, 0, 6.29); ctx.fill();
    }
  } else if(wear.hat === 'tophat'){
    ctx.fillStyle='#2b2b33';
    ctx.beginPath(); ctx.ellipse(sx, hy-8, 17, 5.5, 0, 0, 6.29); ctx.fill();
    roundRect(sx-10, hy-30, 20, 23, 3); ctx.fill();
    ctx.fillStyle='#8b1e2d'; roundRect(sx-10, hy-14, 20, 5, 2); ctx.fill();
  }

  // scythe swing while cutting
  if(a.cut>0){
    const ang = -0.9 + Math.sin(G.t*13)*0.75;
    ctx.save(); ctx.translate(sx+flip*13, sy-28+bob); ctx.rotate(ang*flip); ctx.scale(flip,1);
    ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(0,-22); ctx.stroke();
    ctx.strokeStyle='#d8dde2'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(-14,-20, 15, -0.2, 1.25); ctx.stroke();
    ctx.restore();
  }

  // carried stack
  const total = dancing ? 0 : carried(a), SHOW = 9, STEP = 8.5;
  let idx = 0;
  if(!dancing)
  for(const k of ITEM_ORDER){
    for(let i=0;i<a.carry[k];i++){
      if(idx>=SHOW) break;
      const wob = Math.sin(G.t*6 + idx*0.6)*1.5 + (a.moving? Math.sin(a.bob*4+idx)*1.1:0);
      drawItem(k, sx+wob, sy-62+bob-idx*STEP, 0.9);
      idx++;
    }
  }
  if(total>SHOW && a.hand){
    // farmhands only: their whole load, matching what the HUD shows for you
    const ty = sy-62+bob-SHOW*STEP-6;
    ctx.font='900 15px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.strokeStyle='#00000099'; ctx.lineWidth=4;
    ctx.strokeText(total, sx, ty); ctx.fillText(total, sx, ty);
  }
  if(lean) ctx.restore();
  if(dancing && Math.random() < 0.06){
    puffs.push({ x:a.x + rnd(-.5,.5), y:a.y + rnd(-.5,.5), z:rnd(1.4,2.4),
      vx:rnd(-.8,.8), vy:rnd(-.8,.8), vz:rnd(.8,1.8), t:0, life:rnd(.5,.9),
      col:['#ffe066','#ff9de0','#6fd0ff','#8ef07a'][Math.floor(rnd(0,4))], r:rnd(2,3.6) });
  }
  if(napping){
    ctx.restore();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<3;i++){
      const t = (G.t*0.5 + i/3) % 1;
      ctx.globalAlpha = Math.min(1, 2-2*t);
      ctx.font = '900 ' + (11 + t*9) + 'px system-ui,sans-serif';
      ctx.fillStyle='#fff'; ctx.strokeStyle='#00000077'; ctx.lineWidth=3;
      const zx = sx + 16 + t*13, zy = sy - 24 - t*34;
      ctx.strokeText('z', zx, zy); ctx.fillText('z', zx, zy);
    }
    ctx.globalAlpha = 1;
  }
}

function drawBoard(){
  const c = rectCenter(BOARD), q = iso(c.x, c.y);
  if(!visible(q, 240)) return;
  const pulse = 0.5+0.5*Math.sin(G.t*3);
  quad(BOARD.x, BOARD.y, BOARD.w, BOARD.h, '#000', .18);
  quad(BOARD.x+.08, BOARD.y+.08, BOARD.w-.16, BOARD.h-.16, '#8ed0ff', .32+.14*pulse);

  // posts
  ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=6; ctx.lineCap='round';
  for(const dx of [-30, 30]){ ctx.beginPath(); ctx.moveTo(q.sx+dx, q.sy); ctx.lineTo(q.sx+dx, q.sy-96); ctx.stroke(); }

  const rows = G.orders.length, H = 34 + rows*36, W = 176, y0 = q.sy - 96 - H;
  ctx.fillStyle='#6b4a28'; roundRect(q.sx-W/2-5, y0-5, W+10, H+10, 10); ctx.fill();
  ctx.fillStyle='#f6ecd2'; roundRect(q.sx-W/2, y0, W, H, 7); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='900 14px system-ui,sans-serif'; ctx.fillStyle='#a8560f';
  ctx.fillText('TOWN ORDERS', q.sx, y0+15);

  G.orders.forEach((o,i)=>{
    const ry = y0 + 34 + i*36;
    ctx.fillStyle = i%2 ? '#efe3c4' : '#f6ecd2';
    roundRect(q.sx-W/2+5, ry-14, W-10, 32, 6); ctx.fill();
    const keys = Object.keys(o.need);
    keys.forEach((k,j)=>{
      const x = q.sx - W/2 + 22 + j*52;
      drawItem(k, x, ry-1, .62);
      ctx.font='900 13px system-ui,sans-serif'; ctx.textAlign='left';
      ctx.fillStyle = o.need[k]<=0 ? '#3f9b4a' : '#4a3418';
      ctx.fillText(o.need[k]<=0 ? '\u2713' : 'x'+o.need[k], x+9, ry-1);
    });
    ctx.textAlign='right'; ctx.font='900 14px system-ui,sans-serif'; ctx.fillStyle='#2e8b3f';
    ctx.fillText('$'+fmt(o.pay), q.sx+W/2-10, ry-1);
    ctx.textAlign='center';
  });
}

function drawStandPad(){
  const pulse = 0.5 + 0.5*Math.sin(G.t*3);
  const anyone = customers.some(c=>c.state==='wait' && c.n>0);
  quad(STAND.x, STAND.y, STAND.w, STAND.h, '#000', .18);
  quad(STAND.x+.08, STAND.y+.08, STAND.w-.16, STAND.h-.16,
       anyone ? '#e0a400' : '#8a8f7a', anyone ? .55+0.2*pulse : .34);
  const c = rectCenter(STAND), p = iso(c.x, c.y);
  ctx.font='900 21px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.strokeStyle='#6b4a00'; ctx.lineWidth=5;
  const label = hasKeeper() ? 'STOCK' : 'SERVE';
  ctx.strokeText(label, p.sx, p.sy-6); ctx.fillText(label, p.sx, p.sy-6);
  if(hasKeeper()){
    const n = stockTotal();
    ctx.font='900 15px system-ui,sans-serif'; ctx.lineWidth=4;
    const t = n ? fmt(n)+' in stock' : 'drop goods here';
    ctx.strokeText(t, p.sx, p.sy+14); ctx.fillText(t, p.sx, p.sy+14);
  }
}

function lerpPt(a, b, t){ return [lerp(a.sx,b.sx,t), lerp(a.sy,b.sy,t)]; }

function drawStall(){
  const b = STALL, H = 30, AH = 76;
  const N=iso(b.x,b.y), E=iso(b.x+b.w,b.y), S=iso(b.x+b.w,b.y+b.h), W=iso(b.x,b.y+b.h);
  const up=(p,h)=>[p.sx, p.sy-h];
  ctx.globalAlpha=.22; poly([[N.sx,N.sy+5],[E.sx+6,E.sy+5],[S.sx,S.sy+7],[W.sx-6,W.sy+5]],'#000'); ctx.globalAlpha=1;
  // counter
  poly([up(W,0),up(S,0),up(S,H),up(W,H)], '#c08b4e');
  poly([up(E,0),up(S,0),up(S,H),up(E,H)], '#a87740');
  poly([up(N,H),up(E,H),up(S,H),up(W,H)], '#e8d3ac');
  // produce sitting on the counter
  const stocked = hasKeeper() ? ITEM_ORDER.filter(k=>G.stock[k]>0) : [];
  const shown = (stocked.length ? stocked : wantedItems()).slice(0, 4);
  shown.forEach((k,i)=>{
    const u = (i + 0.5) / shown.length;           // spread across its actual width
    const q = iso(b.x + u*b.w, b.y + b.h/2);
    drawItem(k, q.sx, q.sy-H-4, 0.8);
  });
  // posts
  ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=5; ctx.lineCap='round';
  for(const c of [W,S,E,N]){ ctx.beginPath(); ctx.moveTo(c.sx, c.sy); ctx.lineTo(c.sx, c.sy-AH); ctx.stroke(); }
  // striped awning
  const nUp=[N.sx,N.sy-AH], eUp=[E.sx,E.sy-AH], sUp=[S.sx,S.sy-AH], wUp=[W.sx,W.sy-AH];
  poly([nUp,eUp,sUp,wUp], '#fdf6e6');
  const NU={sx:nUp[0],sy:nUp[1]}, EU={sx:eUp[0],sy:eUp[1]}, SU={sx:sUp[0],sy:sUp[1]}, WU={sx:wUp[0],sy:wUp[1]};
  const bands = 6;
  for(let i=0;i<bands;i+=2){
    poly([ lerpPt(NU,EU,i/bands), lerpPt(NU,EU,(i+1)/bands),
           lerpPt(WU,SU,(i+1)/bands), lerpPt(WU,SU,i/bands) ], '#d9483f');
  }
  poly([nUp,eUp,sUp,wUp], null, '#00000022', 2);
  const mid = iso(b.x+b.w/2, b.y+b.h/2);
  signBoard(mid.sx, mid.sy-AH-26, 'FARM STAND');
}

function drawCustomer(c){
  const p = iso(c.x, c.y);
  drawPerson(c, p.sx, p.sy, c.tint, {hair:'#3d2a16'});
  if(c.happy>0){
    ctx.font='22px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha = clamp(c.happy,0,1);
    ctx.fillText('\u2764\uFE0F', p.sx, p.sy-92);
    ctx.globalAlpha = 1;
    return;
  }
  if(c.state!=='wait' || c.n<=0) return;
  const bx = p.sx+30, by = p.sy-84 - (c.slot>0 ? (c.slot%2)*24 : 0);
  const w = 68, h = 38;
  ctx.fillStyle='#fff'; roundRect(bx-w/2, by-h/2, w, h, 13); ctx.fill();
  poly([[bx-16,by+h/2-2],[bx-4,by+h/2-2],[bx-20,by+h/2+13]], '#fff');
  drawItem(c.want, bx-20, by-2, .74);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='900 15px system-ui,sans-serif'; ctx.fillStyle='#4a3418';
  ctx.fillText('x'+c.n, bx-7, by-7);
  ctx.font='900 13px system-ui,sans-serif'; ctx.fillStyle='#2e8b3f';
  ctx.fillText('$'+standPrice(c.want), bx-7, by+9);
}

/* ------------------------------------------------------------ frame */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,CW,CH);
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#8fd45c'); g.addColorStop(1,'#59a03a');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);

  const shx = shake? rnd(-shake,shake):0, shy = shake? rnd(-shake,shake):0;
  ctx.save();
  ctx.translate(CW/2+shx, CH/2+shy); ctx.scale(ZOOM,ZOOM); ctx.translate(-cam.x,-cam.y);
  view = { x0:cam.x-CW/(2*ZOOM), x1:cam.x+CW/(2*ZOOM), y0:cam.y-CH/(2*ZOOM), y1:cam.y+CH/(2*ZOOM) };

  drawGround();
  drawFarmCosmetics();
  drawCrops();

  // fences around the field
  const F = PATCHES[0].rect;
  fenceLine(F.x-1, F.y-1, F.x+F.w+1, F.y-1);
  fenceLine(F.x-1, F.y-1, F.x-1, F.y+F.h+1);
  fenceLine(F.x+F.w+1, F.y-1, F.x+F.w+1, F.y+F.h+1);

  for(const s of STATIONS){ if(s.unlocked) for(const tr of s.trays) drawTray(s, tr); }
  drawTillPad();
  for(const p of PADS) drawPadGround(p);
  drawStandPad();
  drawBoard();

  // depth-sorted entities
  const list = [];
  for(const d of decor) list.push({ d:d.x+d.y, f:()=>drawDecorItem(d) });
  for(const p of PATCHES){
    if(!patchOpen(p) || p.kind!=='tree') continue;
    for(const t of p.nodes) list.push({ d:t.x+t.y, f:()=>drawTree(t, p) });
  }
  for(const s of STATIONS){ if(s.unlocked) list.push({ d:(s.b.x+s.b.w/2)+(s.b.y+s.b.h/2), f:()=>drawBuilding(s) }); }
  for(const a of actors){
    const p = iso(a.x,a.y);
    list.push({ d:a.x+a.y+0.01, f:()=>drawPerson(a, p.sx, p.sy, a.tint, {hair:a.hand?'#2e2016':'#7a4a1e'}) });
  }
  for(const c of customers){ list.push({ d:c.x+c.y, f:()=>drawCustomer(c) }); }
  list.push({ d:(STALL.x+STALL.w/2)+(STALL.y+STALL.h/2), f:drawStall });
  if(G.till >= 1){ const tc = rectCenter(TILL_PAD); list.push({ d:tc.x+tc.y, f:drawTillPile }); }
  for(const f of flyers){
    const x = lerp(f.x0,f.x1,f.t), y = lerp(f.y0,f.y1,f.t);
    const z = Math.sin(f.t*Math.PI)*f.h + 0.6;
    const p = iso(x,y);
    list.push({ d:x+y+0.4, f:()=>{ ctx.save(); ctx.translate(p.sx, p.sy - z*TH*0.9); ctx.rotate(f.t*f.spin); drawItem(f.item,0,0,1); ctx.restore(); } });
  }
  list.sort((a,b)=>a.d-b.d);
  for(const e of list) e.f();

  for(const p of PADS) drawPadPanel(p);

  // particles + popups on top
  for(const p of puffs){
    const s = iso(p.x,p.y);
    ctx.globalAlpha = clamp(1-p.t/p.life,0,1);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(s.sx, s.sy - p.z*TH*0.9, p.r, 0, 6.29); ctx.fill();
    ctx.globalAlpha=1;
  }
  for(const p of pops){
    const s = iso(p.x,p.y), k = p.t/1.1;
    ctx.globalAlpha = clamp(1.6-k*1.6,0,1);
    ctx.font = '900 '+(p.big?34:24)+'px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const yy = s.sy - p.z*TH*0.9 - k*54;
    ctx.strokeStyle='#00000099'; ctx.lineWidth=6; ctx.strokeText(p.txt, s.sx, yy);
    ctx.fillStyle=p.col; ctx.fillText(p.txt, s.sx, yy);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // ---- screen space ----
  for(const c of coinFx){
    const t=c.t, mt=1-t;
    const x = mt*mt*c.x + 2*mt*t*c.cx + t*t*c.x1;
    const y = mt*mt*c.y + 2*mt*t*c.cy + t*t*c.y1;
    ctx.fillStyle='#4caf50'; ctx.strokeStyle='#2e7d32'; ctx.lineWidth=2;
    roundRect(x-c.r, y-c.r*0.68, c.r*2, c.r*1.36, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#a5e8a8'; ctx.beginPath(); ctx.arc(x,y,c.r*0.35,0,6.29); ctx.fill();
  }
  if(stick.on){
    ctx.globalAlpha=.3; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 66, 0, 6.29); ctx.fill();
    ctx.globalAlpha=.55; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(stick.ox+stick.dx*60, stick.oy+stick.dy*60, 30, 0, 6.29); ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* =======================================================================
   HUD / UI
   ===================================================================== */
const el = id=>document.getElementById(id);
const hudVal = {}, pillSeen = {};
function setPill(id, v, show){
  const node = el(id);
  node.classList.toggle('hide', !show);
  if(hudVal[id]===v) return;
  hudVal[id]=v;
  node.querySelector('span').textContent = v;
  bumpPill(id);
}
function bumpPill(id){
  const n = el(id); n.classList.remove('bump');
  void n.offsetWidth; n.classList.add('bump');
  setTimeout(()=>n.classList.remove('bump'), 130);
}
function buildPills(){
  const box = el('res');
  for(const k of ITEM_ORDER){
    if(el('p-'+k)) continue;
    const d = document.createElement('div');
    d.className = 'pill pop hide'; d.id = 'p-'+k;
    d.innerHTML = '<i>'+iconTag(k)+'</i><span>0</span>';
    box.appendChild(d);
  }
}
function syncHUD(){
  const a = player();
  setPill('p-coin', fmt(G.coins), true);
  const open = availableItems();
  for(const k of ITEM_ORDER){
    const n = a.carry[k];
    if(n > 0) pillSeen[k] = G.t;
    // linger a moment once emptied, so unloading does not make the row flicker
    const recent = pillSeen[k] !== undefined && G.t - pillSeen[k] < 4;
    setPill('p-'+k, n, n > 0 || recent || (k==='wheat' && open.length<2));
  }
  const prev = levelReq(G.level-1), next = levelReq(G.level);
  el('levelfill').style.width = clamp((G.earned-prev)/(next-prev)*100,0,100)+'%';
  el('lvlnum').textContent = 'LVL '+G.level;
  el('lvlname').textContent = rankAt(G.level).name;
  /* The bag panel belongs to a place: it opens at the counter or at the
     stand, and closes itself the moment you wander off. */
  const where = partyOn() ? null : bagSpot();
  el('b-bag').classList.toggle('on', !!where);
  if(bagOpen && bagOpen !== where) closeModal();
}

function hint(key, text, force){
  if(chapterT > 0) return;
  if(G.seenHint[key] && !force) return;
  G.seenHint[key]=1;
  el('hint').textContent = text;
  el('hint').classList.add('on');
  hintTimer = 5;
}

let chapterT = 0;
function showChapter(c){
  const box = el('chapter');
  box.querySelector('.ch-i').textContent = c.icon;
  box.querySelector('.ch-t').textContent = c.title;
  box.querySelector('.ch-b').textContent = c.text;
  box.classList.add('on');
  el('hint').classList.remove('on');
  hintTimer = 0;
  chapterT = 11;
  sfx.levelup();
}

function openSaveFile(){
  save();
  const text = encodeSave(saveData());   // same bytes the download writes
  modal('Your farm, as a file',
    '<div id="savebox">'+
      '<p>Download it to keep a backup, move it to another browser or device, '+
      'or paste one back in below. The text is scrambled on purpose \u2014 copy all '+
      'of it.</p>'+
      '<textarea id="savetxt" spellcheck="false"></textarea>'+
      '<div class="sbtns">'+
        '<button class="sbtn" id="s-dl">DOWNLOAD</button>'+
        '<button class="sbtn" id="s-copy">COPY</button>'+
        '<button class="sbtn" id="s-file">LOAD FILE</button>'+
        '<button class="sbtn go" id="s-paste">LOAD PASTED</button>'+
      '</div>'+
      '<div id="savemsg"></div>'+
      '<input type="file" id="s-input" accept="application/json,.json" hidden>'+
    '</div>', 'CLOSE');

  const box = el('savetxt'); box.value = text;
  const msg = el('savemsg');
  const say = (t, ok)=>{ msg.textContent = t; msg.className = ok ? 's-ok' : 's-bad'; };

  el('s-dl').onclick = ()=>{
    const name = saveFileName();
    // some embeds block downloads silently, so word this so it is true either way
    say(exportSave()
      ? 'Sent ' + name + ' to your downloads. Nothing there? This page blocks downloads \u2014 use COPY.'
      : 'This page cannot start downloads \u2014 use COPY instead.', true);
  };
  el('s-copy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(box.value); say('Copied to the clipboard.', true); }
    catch(e){
      box.focus(); box.select();
      try{ document.execCommand('copy'); say('Copied to the clipboard.', true); }
      catch(e2){ say('Copy blocked \u2014 select the text and copy it by hand.', false); }
    }
  };
  el('s-file').onclick = ()=> el('s-input').click();
  el('s-input').onchange = ev=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const err = importSave(String(rd.result));
      if(err) say(err, false);
      else { closeModal(); sfx.buy();
             hint('loaded','Farm loaded \u2014 level '+G.level+', $'+fmt(G.coins)+' in hand', true); }
    };
    rd.onerror = ()=> say('Could not read that file.', false);
    rd.readAsText(f);
  };
  el('s-paste').onclick = ()=>{
    const err = importSave(box.value);
    if(err) say(err, false);
    else { closeModal(); sfx.buy();
           hint('loaded','Farm loaded \u2014 level '+G.level+', $'+fmt(G.coins)+' in hand', true); }
  };
}

function openShop(){
  const rows = COSMETICS.map(c=>{
    const own = owned(c.id), on = worn(c);
    const state = !own ? '$'+fmt(c.cost) : (on ? 'WORN' : 'WEAR');
    const cls = !own ? (G.coins >= c.cost ? 'buy' : 'buy poor') : (on ? 'on' : '');
    return '<div class="crow"><span class="ci">'+c.icon+'</span>'+
           '<span class="cn">'+c.name+'</span>'+
           '<button class="cb '+cls+'" data-c="'+c.id+'">'+state+'</button></div>';
  }).join('');
  const partyState = G.cos.party ? 'THROW IT' : '$'+fmt(PARTY_COST);
  modal('The good life',
    '<div id="shop">'+
      '<p class="sub">Your farm makes more than you can spend. Spend it.</p>'+ rows +
      '<div class="crow party"><span class="ci">\u{1F389}</span>'+
      '<span class="cn">Throw a village party</span>'+
      '<button class="cb '+(G.cos.party?'on':(G.coins>=PARTY_COST?'buy':'buy poor'))+'" data-c="party">'+partyState+'</button></div>'+
      '<div id="shopmsg"></div>'+
    '</div>', 'CLOSE');

  const msg = el('shopmsg');
  el('shop').querySelectorAll('.cb').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.c;
      if(id === 'party'){
        if(!G.cos.party){
          if(G.coins < PARTY_COST){ msg.textContent = 'Not yet \u2014 that costs $'+fmt(PARTY_COST)+'.'; return; }
          G.coins -= PARTY_COST; G.cos.party = 1;
        }
        closeModal(); startParty(); save(); return;
      }
      const c = COSMETICS.find(x=>x.id===id);
      if(!owned(c.id)){
        if(G.coins < c.cost){ msg.textContent = 'Not yet \u2014 that costs $'+fmt(c.cost)+'.'; return; }
        G.coins -= c.cost; G.cos[c.id] = 1; G.wear[c.slot] = c.id;
        sfx.buy(); shake = Math.max(shake, 6);
      } else {
        G.wear[c.slot] = worn(c) ? null : c.id;   // one hat at a time
        sfx.pick();
      }
      save(); openShop();                          // redraw the list in place
    };
  });
}

/* ---------------------------------------------------------- the bag panel
   Walking onto a tray moves the whole bag at once, which is fine until you
   only want the takings, or only want to sell the cheese. The panel is the
   deliberate version of the same thing: it opens within reach of the counter
   or the stand and moves one good at a time.                              */
function bagSpot(){
  const a = player();
  const sell = rectCenter(station('market').trays[0]);
  if(dist2(a.x, a.y, sell.x, sell.y) < 25) return 'market';
  const st = rectCenter(STAND);
  if(dist2(a.x, a.y, st.x, st.y) < 25) return 'stand';
  return null;
}

/* Sell one good outright. Never assume the stack is there: the market bug
   that paid wheat rates for cheese started exactly that way. */
function sellFromBag(k){
  const a = player(), have = a.carry[k] || 0;
  if(have <= 0) return 'There is none of that in the bag.';
  a.carry[k] = 0;
  const pay = ITEMS[k].price * have;
  G.coins += pay; G.earned += pay;
  sfx.coin(); spawnCoinFx();
  pops.push({ x:a.x, y:a.y, z:1.3, t:0, txt:'+'+fmt(pay), col:'#7dff8d' });
  checkLevel(); save();
  return null;
}

/* Hand one good to the stand: into stock if a keeper minds it, otherwise
   straight to whoever in the queue asked for it. */
function standFromBag(k){
  const a = player(), have = a.carry[k] || 0;
  if(have <= 0) return 'There is none of that in the bag.';
  if(hasKeeper()){
    const room = stockRoom(k);
    if(room <= 0) return 'The stall is already full of ' + ITEMS[k].label.toLowerCase() + '.';
    const step = Math.min(have, room);
    a.carry[k] -= step; G.stock[k] += step;
    sfx.pick(); save();
    pops.push({ x:a.x, y:a.y, z:1.3, t:0, txt:'+'+step+' in stock', col:'#8ef07a' });
    return null;
  }
  let sold = 0, pay = 0;
  for(const c of customers){
    if(c.state!=='wait' || c.n<=0 || c.want!==k || a.carry[k]<=0) continue;
    const step = Math.min(a.carry[k], c.n);
    a.carry[k] -= step; c.n -= step; sold += step; pay += standPrice(k)*step;
    if(c.n <= 0){
      c.state='leave'; c.slot=-1; c.happy=1.4;
      for(let i=0;i<10;i++) puffs.push({x:c.x,y:c.y,z:1.0,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),vz:rnd(1.5,3.5),
        t:0,life:rnd(.4,.8),col:['#ffe066','#8ef07a','#ff9de0'][i%3],r:rnd(2,4)});
    }
  }
  if(!sold) return 'Nobody in the queue is asking for that.';
  G.coins += pay; G.earned += pay;
  sfx.coin(); spawnCoinFx();
  pops.push({ x:a.x, y:a.y, z:1.5, t:0, txt:'+'+fmt(pay), col:'#7dff8d' });
  checkLevel(); save();
  return null;
}

let bagOpen = null;
function openBag(where, msg){
  const a = player(), keeper = hasKeeper();
  const held = ITEM_ORDER.filter(k => a.carry[k] > 0);
  let rows = held.map(k => {
    const have = a.carry[k];
    // the counter takes the lot, so its button can name the money. The stand
    // only takes what the villager at the front asked for.
    const label = where==='market' ? 'SELL $'+fmt(ITEMS[k].price*have) : (keeper ? 'STOCK IT' : 'SELL');
    const note = where==='market' ? '' : ' \u00b7 $'+fmt(standPrice(k))+' each';
    return '<div class="crow"><span class="ci">'+iconTag(k)+'</span>'+
           '<span class="cn">'+ITEMS[k].label+' <span class="cq">\u00d7'+have+note+'</span></span>'+
           '<button class="cb buy" data-k="'+k+'">'+label+'</button></div>';
  }).join('');
  if(!held.length) rows = '<p class="sub">Your bag is empty \u2014 go and fill it.</p>';
  if(where==='market'){
    const got = G.till >= 1;
    rows += '<div class="crow till"><span class="ci">\u{1F4B5}</span>'+
            '<span class="cn">Farmhand takings</span>'+
            '<button class="cb '+(got?'buy':'')+'" data-k="__till">'+
            (got ? 'COLLECT $'+fmt(G.till) : 'NOTHING YET')+'</button></div>';
  }
  modal(where==='market' ? 'At the counter' : 'At the farm stand',
    '<div id="bag">'+ rows +'</div><div id="bagmsg">'+(msg||'')+'</div>', 'CLOSE');
  bagOpen = where;                       // modal() clears it, so set it after

  el('bag').querySelectorAll('.cb').forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.k;
      let err = null;
      if(k === '__till') err = collectTill() ? null : 'The farmhands have not sold anything yet.';
      else err = where==='market' ? sellFromBag(k) : standFromBag(k);
      // a level-up can put its own card on top; do not paint over it
      if(bagOpen === where) openBag(where, err);
    };
  });
}

/* The ladder, so a player can see what the next title costs. Requirements are
   lifetime earnings, which is what levelReq() measures — not coins in hand. */
function openRanks(){
  const here = rankAt(G.level), nx = nextRank(G.level);
  let html = '<div id="ranks">';
  for(const r of RANKS){
    const got = G.level >= r.lv, cur = r === here;
    html += '<div class="rr'+(cur?' cur':'')+(got?'':' lock')+'">'+
            '<span class="rl">'+(cur?'\u2605':(got?'\u2713':r.lv))+'</span>'+
            '<span class="rn">'+r.name+'</span>'+
            '<span class="rq">'+(cur?'you are here':(got?'lvl '+r.lv
                : 'lvl '+r.lv+' \u00b7 $'+fmt(levelReq(r.lv-1))+' earned'))+'</span></div>';
  }
  html += '</div>';
  const need = levelReq(G.level) - G.earned;
  html += '<p class="sub" id="rnext">'+ (nx
      ? 'Level '+(G.level+1)+' in $'+fmt(Math.max(0,need))+' more earned. '+
        '<b>'+nx.name+'</b> waits at level '+nx.lv+'.'
      : 'There is nothing above you. Sorry.') +'</p>';
  modal('Levels \u0026 titles', html, 'CLOSE');
  const cur = el('ranks').querySelector('.cur');
  if(cur) cur.scrollIntoView({ block:'center' });
}

function openJournal(){
  let html = '<div id="jrn">';
  for(const c of STORY){
    if(G.story[c.id]) html += '<div class="e"><b>'+c.icon+'  '+c.title+'</b><span>'+c.text+'</span></div>';
    else { html += '<div class="e lock"><b>\u{1F512}  ?</b><span>Not yet.</span></div>'; break; }
  }
  html += '</div>';
  modal('The Hollowbrook Journal', html, 'CLOSE');
}

let modalConfirm = null;
function closeModal(){ el('modal').classList.remove('on'); modalConfirm = null; bagOpen = null; }
function modal(title, html, btn, opts){
  opts = opts || {};
  el('m-title').textContent = title;
  el('m-body').innerHTML = html;
  const ok = el('m-ok'), cancel = el('m-cancel');
  ok.textContent = btn || 'OK';
  ok.classList.toggle('danger', !!opts.danger);
  cancel.hidden = !opts.cancel;
  if(opts.cancel) cancel.textContent = opts.cancel;
  modalConfirm = opts.onConfirm || null;      // never survives the dialog that set it
  bagOpen = null;                             // nor does the bag panel
  el('modal').classList.add('on');
}
el('m-ok').onclick = ()=>{ const fn = modalConfirm; closeModal(); if(fn) fn(); };
el('m-cancel').onclick = closeModal;
// tapping the dimmed area or pressing Escape backs out, never confirms
el('modal').onclick = e=>{ if(e.target === el('modal')) closeModal(); };
addEventListener('keydown', e=>{
  if(e.key === 'Escape' && el('modal').classList.contains('on')) closeModal();
});

function winModal(){
  modal('HARVEST FESTIVAL',
    '<p>Hollowbrook is a working valley again \u2014 the mill turning, the ovens lit, '+
    'the road busy with people who came for what you grew.</p>'+
    '<p class="sub">Gran would be unbearable about it. Keep playing \u2014 the pads go higher.</p>', 'RAISE A GLASS');
}

el('b-bag').onclick = ()=>{ const w = bagSpot(); if(w) openBag(w); };
el('b-journal').onclick = openJournal;
el('lvltxt').onclick = openRanks;
el('b-shop').onclick = openShop;
el('p-dance').onclick = playerDance;
el('p-end').onclick = endParty;
addEventListener('keydown', e=>{ if(e.code === 'Space' && partyOn()){ e.preventDefault(); playerDance(); } });
el('b-save').onclick = openSaveFile;
el('b-sound').onclick = ()=>{
  G.sound = !G.sound;
  el('b-sound').innerHTML = G.sound ? '&#128266;' : '&#128263;';
  save();
};
el('b-reset').onclick = ()=>{
  modal('Start a fresh farm?',
    '<p>This wipes your coins, upgrades, farmhands and story.</p>' +
    '<p class="sub">There is no undo \u2014 take a copy with \u{1F4BE} first if you might want it back.</p>',
    'WIPE IT', { cancel:'KEEP MY FARM', danger:true, onConfirm:doReset });
};
function doReset(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  const snd = G.sound;
  resetGame(); G.sound = snd;
  buildDecor();
  cam.x = iso(player().x, player().y).sx; cam.y = iso(player().x, player().y).sy;
  hint('move','Drag anywhere to move. Sweep through the wheat!', true);
}

/* =======================================================================
   BOOT
   ===================================================================== */
function init(){
  let raw=null; try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  resetGame();
  if(raw){ try{ localStorage.setItem(SAVE_KEY, raw); }catch(e){} load(); }
  buildDecor();
  resize();
  const p = iso(player().x, player().y); cam.x=p.sx; cam.y=p.sy;
  el('b-sound').innerHTML = G.sound ? '&#128266;' : '&#128263;';
  buildPills();
  syncHUD();
  hint('move','Drag anywhere to move. Sweep through the wheat!');
  checkStory();
  if(saveNotice) modal('That save could not be loaded',
    '<p>' + saveNotice + '</p>' +
    '<p class="sub">The old file was kept aside rather than overwritten, so nothing is lost for good.</p>',
    'START FRESH');
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
init();
requestAnimationFrame(frame);
</script>
